<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bangla Choti Kahinii - বাংলা গল্পের সবচেয়ে বড় ঠিকানা</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green-dark: #1a5c38;
      --green-main: #217a47;
      --green-light: #2ea05c;
      --green-bg: #e8f5ee;
      --green-pale: #f0f9f4;
      --red-hot: #e63946;
      --gold: #f4a261;
      --text-dark: #1a1a2e;
      --text-gray: #555;
      --text-light: #888;
      --border: #d4e8dc;
      --white: #fff;
      --bg-body: #f5faf7;
      --shadow: 0 2px 12px rgba(33,122,71,0.10);
    }

    body {
      font-family: 'Hind Siliguri', sans-serif;
      background: var(--bg-body);
      color: var(--text-dark);
      min-height: 100vh;
    }

    /* ===== HEADER ===== */
    .header {
      background: #fff;
      border-bottom: 2px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
    }
    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .hamburger {
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 5px;
      padding: 4px;
    }
    .hamburger span {
      display: block;
      width: 22px;
      height: 2.5px;
      background: var(--text-dark);
      border-radius: 2px;
    }
    .logo-wrap {
      text-align: center;
      flex: 1;
    }
    .logo-wrap .logo-text {
      font-size: 24px;
      font-weight: 700;
      color: var(--green-dark);
      font-family: Georgia, serif;
    }
    .logo-wrap .logo-text span { color: var(--green-light); }
    .logo-wrap .logo-leaf { color: var(--green-light); }
    .logo-wrap .tagline {
      font-size: 11px;
      color: var(--text-gray);
      margin-top: 1px;
    }
    .header-icons {
      display: flex;
      gap: 14px;
      align-items: center;
    }
    .header-icons button {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 20px;
      color: var(--text-dark);
      padding: 4px;
    }

    /* ===== NAV ===== */
    .nav {
      background: var(--green-dark);
      padding: 0;
    }
    .nav-inner {
      display: flex;
      align-items: center;
      max-width: 1200px;
      margin: 0 auto;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .nav-inner::-webkit-scrollbar { display: none; }
    .nav-link {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 12px 18px;
      color: #fff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      white-space: nowrap;
      transition: background 0.2s;
    }
    .nav-link:hover, .nav-link.active {
      background: var(--green-light);
    }
    .nav-link.active {
      background: var(--green-main);
      border-radius: 6px 6px 0 0;
    }
    .nav-live {
      margin-left: auto;
      background: #e63946;
      color: #fff;
      border: none;
      padding: 9px 18px;
      border-radius: 22px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      margin-right: 12px;
      margin-top: 5px;
      margin-bottom: 5px;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%,100% { box-shadow: 0 0 0 0 rgba(230,57,70,0.5); }
      50% { box-shadow: 0 0 0 7px rgba(230,57,70,0); }
    }

    /* ===== CATEGORY OVERLAY ===== */
    .category-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 3000;
      background: rgba(0,0,0,0.18);
    }
    .category-overlay.open { display: block; }
    .category-menu {
      position: fixed;
      width: min(360px, calc(100vw - 20px));
      max-height: 72vh;
      overflow-y: auto;
      background: #303030;
      border-radius: 0 0 4px 4px;
      box-shadow: 0 12px 30px rgba(0,0,0,.30);
    }
    .category-menu-title {
      padding: 13px 20px;
      color: #fff;
      font-size: 17px;
      font-weight: 700;
      border-bottom: 1px solid rgba(255,255,255,.08);
    }
    .category-menu button {
      width: 100%;
      display: block;
      border: 0;
      background: transparent;
      color: #fff;
      text-align: left;
      padding: 12px 20px;
      font-family: 'Hind Siliguri', sans-serif;
      font-size: 15px;
      cursor: pointer;
      line-height: 1.45;
    }
    .category-menu button:hover,
    .category-menu button.active { background: #3d3d3d; color: #fff; }
    .category-menu .cat-loading {
      color: #ccc;
      padding: 20px;
      text-align: center;
    }

    /* ===== HERO BANNER ===== */
    .hero {
      background: linear-gradient(135deg, #0d3d22 0%, #1a5c38 50%, #0d3d22 100%);
      padding: 28px 20px 22px;
      position: relative;
      overflow: hidden;
    }
    .hero::before {
      content: '';
      position: absolute;
      right: 0; top: 0; bottom: 0;
      width: 45%;
      background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="%23ffffff08"/></svg>');
      opacity: 0.15;
    }
    .hero-quote {
      font-size: 22px;
      font-weight: 700;
      color: #7cffab;
      margin-bottom: 4px;
      font-family: Georgia, serif;
    }
    .hero-quote::before { content: '" '; }
    .hero-sub {
      font-size: 13px;
      color: #a8d5b8;
      margin-bottom: 18px;
    }
    .hero-sub::before { content: '↳ '; }
    .hero-right-text {
      position: absolute;
      right: 22px;
      top: 32px;
      color: #c5f5d9;
      font-size: 13px;
      text-align: right;
      line-height: 1.5;
    }
    .hero-right-text .heart { color: #ff6b8a; }
    .search-bar {
      display: flex;
      background: #fff;
      border-radius: 8px;
      overflow: hidden;
      max-width: 520px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
    }
    .search-bar input {
      flex: 1;
      border: none;
      outline: none;
      padding: 12px 16px;
      font-size: 14px;
      font-family: 'Hind Siliguri', sans-serif;
      background: transparent;
    }
    .search-bar button {
      background: var(--green-main);
      color: #fff;
      border: none;
      padding: 12px 22px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: 'Hind Siliguri', sans-serif;
    }
    .search-bar button:hover { background: var(--green-dark); }
    .filter-tags {
      display: flex;
      gap: 8px;
      margin-top: 16px;
      flex-wrap: wrap;
    }
    .filter-tag {
      background: rgba(255,255,255,0.12);
      color: #e8faf0;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 20px;
      padding: 5px 14px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
      font-family: 'Hind Siliguri', sans-serif;
    }
    .filter-tag:hover, .filter-tag.active {
      background: rgba(255,255,255,0.25);
      border-color: rgba(255,255,255,0.5);
    }

    /* ===== STORIES LIST ===== */
    .stories-section {
      max-width: 800px;
      margin: 0 auto;
      padding: 16px 14px;
    }

    .story-card {
      background: #fff;
      border-radius: 12px;
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 14px;
      margin-bottom: 14px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      transition: transform 0.15s, box-shadow 0.15s;
      text-decoration: none;
      color: inherit;
      cursor: pointer;
      position: relative;
    }
    .story-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(33,122,71,0.14);
    }

    .story-thumb {
      position: relative;
      flex-shrink: 0;
      width: 130px;
      height: 95px;
      border-radius: 8px;
      overflow: hidden;
      background: var(--green-bg);
    }
    .story-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .story-thumb .no-img {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #c8ebd8, #e8f5ee);
      font-size: 32px;
    }
    .badge {
      position: absolute;
      top: 6px;
      left: 6px;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .badge-new { background: #2ea05c; color: #fff; }
    .badge-hot { background: #e63946; color: #fff; }

    .story-body { flex: 1; min-width: 0; }
    .story-title {
      font-size: 17px;
      font-weight: 700;
      color: var(--text-dark);
      margin-bottom: 5px;
      line-height: 1.4;
    }
    .story-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 12px;
      color: var(--text-light);
      margin-bottom: 7px;
      flex-wrap: wrap;
    }
    .story-meta span { display: flex; align-items: center; gap: 3px; }
    .story-excerpt {
      font-size: 13px;
      color: var(--text-gray);
      line-height: 1.55;
      margin-bottom: 9px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .story-cats {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .story-cat {
      background: var(--green-bg);
      color: var(--green-dark);
      border: 1px solid #b8ddc8;
      border-radius: 14px;
      padding: 3px 10px;
      font-size: 11px;
      font-weight: 500;
    }
    .story-arrow {
      width: 34px;
      height: 34px;
      background: var(--green-main);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 16px;
      flex-shrink: 0;
      align-self: center;
      transition: background 0.2s;
    }
    .story-card:hover .story-arrow { background: var(--green-dark); }
    .bookmark-btn {
      position: absolute;
      top: 12px;
      right: 50px;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 18px;
      color: #bbb;
      transition: color 0.2s;
      padding: 4px;
    }
    .bookmark-btn:hover, .bookmark-btn.saved { color: var(--green-main); }

    /* ===== LOADING ===== */
    .loading-spinner {
      text-align: center;
      padding: 40px;
      color: var(--text-light);
      font-size: 15px;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid var(--green-bg);
      border-top-color: var(--green-main);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ===== PAGINATION ===== */
    .pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 24px 14px 32px;
      flex-wrap: wrap;
    }
    .page-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 2px solid var(--border);
      background: #fff;
      color: var(--text-dark);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-family: 'Hind Siliguri', sans-serif;
    }
    .page-btn:hover { border-color: var(--green-main); color: var(--green-main); }
    .page-btn.active { background: var(--green-main); color: #fff; border-color: var(--green-main); }
    .page-prev, .page-next {
      padding: 0 16px;
      height: 38px;
      border-radius: 22px;
      border: 2px solid var(--border);
      background: var(--green-dark);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-family: 'Hind Siliguri', sans-serif;
    }
    .page-prev:hover, .page-next:hover { background: var(--green-main); }
    .page-dots { color: var(--text-light); font-size: 18px; padding: 0 4px; }

    /* ===== FOOTER ===== */
    .footer {
      background: var(--green-dark);
      color: #c5f5d9;
      text-align: center;
      padding: 18px;
      font-size: 13px;
      border-top: 3px solid var(--green-main);
    }
    .footer .footer-quote {
      font-size: 13px;
      font-style: italic;
      opacity: 0.8;
    }
    .footer-leaf { color: var(--green-light); }

    /* ===== STORY MODAL ===== */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 2000;
      overflow-y: auto;
      padding: 20px 10px;
    }
    .modal-overlay.open { display: flex; align-items: flex-start; justify-content: center; }
    .modal-box {
      background: #fff;
      border-radius: 16px;
      max-width: 720px;
      width: 100%;
      overflow: hidden;
      animation: fadeUp 0.25s ease;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .modal-header {
      background: var(--green-dark);
      padding: 18px 20px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
    }
    .modal-title {
      color: #fff;
      font-size: 20px;
      font-weight: 700;
      line-height: 1.35;
    }
    .modal-close {
      background: rgba(255,255,255,0.15);
      border: none;
      color: #fff;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .modal-img {
      width: 100%;
      max-height: 280px;
      object-fit: cover;
    }
    .modal-meta {
      display: flex;
      gap: 14px;
      padding: 14px 20px 0;
      font-size: 13px;
      color: var(--text-light);
      flex-wrap: wrap;
    }
    .modal-content {
      padding: 16px 20px 24px;
      font-size: 15px;
      line-height: 1.85;
      color: var(--text-dark);
    }

    /* ===== DARK MODE ===== */
    body.dark {
      --bg-body: #0d1f14;
      --text-dark: #e8f5ee;
      --text-gray: #9dbdaa;
      --text-light: #6a9978;
      --border: #1e3d2a;
      --white: #0d1f14;
      --shadow: 0 2px 12px rgba(0,0,0,0.4);
      background: #0d1f14;
    }
    body.dark .header { background: #0d2018; border-color: #1e3d2a; }
    body.dark .story-card { background: #0d2018; border-color: #1e3d2a; }
    body.dark .search-bar { background: #0d2018; }
    body.dark .search-bar input { background: #0d2018; color: #e8f5ee; }
    body.dark .story-cat { background: #1a3d28; color: #7cffab; }
    body.dark .page-btn { background: #0d2018; border-color: #1e3d2a; color: #e8f5ee; }
    body.dark .modal-box { background: #0d2018; }
    body.dark .modal-content { color: #e8f5ee; }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 600px) {
      .story-thumb { width: 100px; height: 80px; }
      .story-title { font-size: 15px; }
      .hero-quote { font-size: 18px; }
      .hero-right-text { display: none; }
      .nav-link { padding: 10px 12px; font-size: 13px; }
    }
  </style>
</head>
<body>

<!-- ===== HEADER ===== -->
<header class="header">
  <div class="header-top">
    <button class="hamburger" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
    <div class="logo-wrap">
      <div class="logo-text">Bangla Choti Kahinii<span class="logo-leaf">🌿</span></div>
      <div class="tagline">বাংলা গল্পের সবচেয়ে বড় ঠিকানা</div>
    </div>
    <div class="header-icons">
      <button id="darkToggle" title="Dark Mode">🌙</button>
      <button id="searchToggle" title="Search">🔍</button>
    </div>
  </div>
</header>

<!-- ===== NAV ===== -->
<nav class="nav">
  <div class="nav-inner">
    <a href="#" class="nav-link active" onclick="filterCat(''); return false;">🏠 হোম</a>
    <a href="#" class="nav-link" id="categoryNavBtn" onclick="showCategoryMenu(event); return false;">বিভাগ ▾</a>
    <a href="#" class="nav-link" onclick="showSubmitModal(); return false;">গল্প লিখে পাঠান</a>
    <a href="#" class="nav-link" onclick="filterCat('hot'); return false;">সেরা গল্প</a>
    <a href="#" class="nav-link">যোগাযোগ</a>
    <button class="nav-live">🔥 LIVE CAMS</button>
  </div>
</nav>

<!-- ===== CATEGORY OVERLAY ===== -->
<div class="category-overlay" id="categoryOverlay" onclick="closeCategoryMenu(event)">
  <div class="category-menu" id="categoryMenu" onclick="event.stopPropagation()">
    <div class="category-menu-title">বিভাগ</div>
    <div class="cat-loading">বিভাগ লোড হচ্ছে...</div>
  </div>
</div>

<!-- ===== HERO ===== -->
<div class="hero">
  <div class="hero-quote">গল্প মানেই অনুভূতি...</div>
  <div class="hero-sub">বাস্তবতার ছোঁয়ায় লেখা নিষিদ্ধ সব কল্পনা</div>
  <div class="hero-right-text">গল্পে লুকিয়ে<br>অন্য এক জগত...<span class="heart">♡</span></div>
  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="আপনার পছন্দের গল্প খুঁজুন..." />
    <button onclick="doSearch()">খুঁজুন</button>
  </div>
  <div class="filter-tags" id="filterTags">
    <button class="filter-tag active" onclick="filterCat('', this)">🔥 জনপ্রিয়</button>
    <button class="filter-tag" onclick="filterCat('new', this)">💚 নতুন গল্প</button>
    <button class="filter-tag" onclick="filterCat('real', this)">📖 বাস্তব ঘটনা</button>
    <button class="filter-tag" onclick="filterCat('porkiya', this)">📚 পরকীয়া</button>
    <button class="filter-tag" onclick="filterCat('grihobodhu', this)">👥 গৃহবধু</button>
    <button class="filter-tag" onclick="filterCat('teacher-student', this)">☕ শিক্ষক-ছাত্রী</button>
    <button class="filter-tag">... আরও</button>
  </div>
</div>

<!-- ===== STORIES ===== -->
<main class="stories-section" id="storiesSection">
  <div class="loading-spinner">
    <div class="spinner"></div>
    <div>গল্প লোড হচ্ছে...</div>
  </div>
</main>

<!-- ===== PAGINATION ===== -->
<div class="pagination" id="paginationWrap"></div>

<!-- ===== FOOTER ===== -->
<footer class="footer">
  <div class="footer-quote"><span class="footer-leaf">🌿</span> "গল্প পড়ুন, কল্পনার জগতে হারিয়ে যান..."</div>
</footer>

<!-- ===== STORY MODAL ===== -->
<div class="modal-overlay" id="storyModal">
  <div class="modal-box">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">গল্পের শিরোনাম</div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <img class="modal-img" id="modalImg" src="" alt="" style="display:none" />
    <div class="modal-meta" id="modalMeta"></div>
    <div class="modal-content" id="modalContent"></div>
  </div>
</div>

<script>
  const API = 'https://choti.onrender.com';
  let currentPage = 1;
  let currentCat = '';
  let currentSearch = '';
  let totalPages = 1;

  function escapeHTML(v) {
    return String(v ?? '').replace(/[&<>"']/g, m => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'
    }[m]));
  }

  // ===== LOAD STORIES =====
  async function loadStories(page = 1, cat = '', search = '') {
    currentPage = page;
    currentCat = cat;
    currentSearch = search;

    const section = document.getElementById('storiesSection');
    section.innerHTML = '<div class="loading-spinner"><div class="spinner"></div><div>গল্প লোড হচ্ছে...</div></div>';

    try {
      let url = `${API}/api/stories?page=${page}&limit=15`;
      if (cat) url += `&category=${cat}`;
      if (search) url += `&search=${encodeURIComponent(search)}`;

      const res = await fetch(url);
      const data = await res.json();

      totalPages = data.totalPages;
      renderStories(data.stories);
      renderPagination(page, data.totalPages, data.total);
    } catch (err) {
      section.innerHTML = '<div class="loading-spinner">⚠️ গল্প লোড করতে সমস্যা হয়েছে।</div>';
    }
  }

  // ===== RENDER STORIES =====
  function renderStories(stories) {
    const section = document.getElementById('storiesSection');
    if (!stories || stories.length === 0) {
      section.innerHTML = '<div class="loading-spinner">কোনো গল্প পাওয়া যায়নি।</div>';
      return;
    }

    section.innerHTML = stories.map(s => {
      const date = new Date(s.createdAt).toLocaleDateString('bn-BD', {
        day: '2-digit', month: '2-digit', year: 'numeric'
      });
      const badge = s.isNew ? '<span class="badge badge-new">NEW</span>'
                   : s.isHot ? '<span class="badge badge-hot">🔥 HOT</span>' : '';
      const imgHtml = s.image
        ? `<img src="${s.image}" alt="${s.title}" loading="lazy" />`
        : `<div class="no-img">📖</div>`;
      const cats = (s.categories || []).map(c =>
        `<span class="story-cat">${escapeHTML(categoryDisplayName(c))}</span>`
      ).join('');

      return `
        <div class="story-card" onclick='openStory(${JSON.stringify(s.slug || '')}, ${JSON.stringify(s._id || '')})'>
          <div class="story-thumb">
            ${imgHtml}
            ${badge}
          </div>
          <div class="story-body">
            <div class="story-title">${s.title}</div>
            <div class="story-meta">
              <span>👤 ${s.author}</span>
              <span>📅 ${date}</span>
              <span>👁 ${(s.views || 0).toLocaleString('bn-BD')}</span>
            </div>
            <div class="story-excerpt">${s.excerpt || ''}</div>
            <div class="story-cats">${cats}</div>
          </div>
          <button class="bookmark-btn" onclick="toggleBookmark(event, '${s._id}')">🔖</button>
          <div class="story-arrow">›</div>
        </div>
      `;
    }).join('');
  }

  // ===== RENDER PAGINATION =====
  function renderPagination(page, totalPages, total) {
    const wrap = document.getElementById('paginationWrap');
    if (totalPages <= 1) { wrap.innerHTML = ''; return; }

    let pages = [];
    if (totalPages <= 7) {
      for (let i = 1; i <= totalPages; i++) pages.push(i);
    } else {
      pages = [1, 2, 3, 4, 5, '...', totalPages];
    }

    wrap.innerHTML = `
      <button class="page-prev" onclick="loadStories(${Math.max(1, page-1)}, '${currentCat}', '${currentSearch}')" ${page === 1 ? 'disabled' : ''}>← Previous</button>
      ${pages.map(p =>
        p === '...'
          ? `<span class="page-dots">...</span>`
          : `<button class="page-btn ${p === page ? 'active' : ''}" onclick="loadStories(${p}, '${currentCat}', '${currentSearch}')">${p}</button>`
      ).join('')}
      <button class="page-next" onclick="loadStories(${Math.min(totalPages, page+1)}, '${currentCat}', '${currentSearch}')" ${page === totalPages ? 'disabled' : ''}>Next →</button>
    `;
  }

  // ===== OPEN STORY PAGE =====
  function openStory(slug, id) {
    // Slug থাকলে clean URL ব্যবহার হবে
    if (slug) {
      window.location.href = `/${encodeURIComponent(slug)}/`;
      return;
    }

    // পুরোনো story-তে slug না থাকলে ID দিয়ে story.html খুলবে
    // এতে /story-এর মতো ভুল URL হবে না
    if (id) {
      window.location.href = `/story.html?id=${encodeURIComponent(id)}`;
    }
  }

  function closeModal() {
    document.getElementById('storyModal').classList.remove('open');
    document.body.style.overflow = '';
  }

  // Close modal on overlay click
  document.getElementById('storyModal').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });

  // ===== CATEGORY NAMES =====
  const CATEGORY_NAME_MAP = {
    'ojachar': 'অজাচার বাংলা চটি গল্প',
    'kajer-mashi': 'কাজের মাসি চোদার গল্প',
    'kajer-meye': 'কাজের মেয়ে চোদার গল্প',
    'kumari-meye': 'কুমারী মেয়ে চোদার গল্প',
    'grihobodhu': 'গৃহবধূ চোদন কাহিনী',
    'gay': 'গে সেক্স চটি',
    'gram-sex': 'গ্রাম সেক্সের বাংলা চটি গল্প',
    'porkiya': 'পরকীয়া বাংলা চটি গল্প',
    'mature': 'পরিপক্ক চোদাচুদি গল্প',
    'protibeshi': 'প্রতিবেশী চোদার চটি গল্প',
    'famous': 'ফেমাস বাংলা চটি গল্প',
    'babaji': 'বাবাজী চোদার বাংলা চটি গল্প',
    'somokami': 'সমকামী বাংলা চটি গল্প',
    'best': 'সেরা বাংলা চটি',
    'student': 'স্টুডেন্ট বাংলা চটি গল্প',
    'swami-stri': 'স্বামী স্ত্রী বাংলা চটি গল্প',
    'hijra': 'হিজরা শীলে বাংলা চটি গল্প'
  };

  function categoryDisplayName(cat) {
    const slug = String(cat?.slug || cat || '').toLowerCase();
    if (CATEGORY_NAME_MAP[slug]) return CATEGORY_NAME_MAP[slug];

    const name = String(cat?.name || cat || '');
    const n = name.toLowerCase();
    if (n.includes('অজাচার')) return 'অজাচার বাংলা চটি গল্প';
    if (n.includes('কাজের মাসি')) return 'কাজের মাসি চোদার গল্প';
    if (n.includes('কাজের মেয়ে') || n.includes('কাজের মেয়ে')) return 'কাজের মেয়ে চোদার গল্প';
    if (n.includes('কুমারী')) return 'কুমারী মেয়ে চোদার গল্প';
    if (n.includes('গৃহবধূ') || n.includes('গৃহবধু')) return 'গৃহবধূ চোদন কাহিনী';
    if (n.includes('গে')) return 'গে সেক্স চটি';
    if (n.includes('গ্রাম')) return 'গ্রাম সেক্সের বাংলা চটি গল্প';
    if (n.includes('পরকীয়া') || n.includes('পরকীয়া')) return 'পরকীয়া বাংলা চটি গল্প';
    if (n.includes('পরিপক্ক')) return 'পরিপক্ক চোদাচুদি গল্প';
    if (n.includes('প্রতিবেশী')) return 'প্রতিবেশী চোদার চটি গল্প';
    if (n.includes('ফেমাস')) return 'ফেমাস বাংলা চটি গল্প';
    if (n.includes('বাবাজী') || n.includes('বাবাজি')) return 'বাবাজী চোদার বাংলা চটি গল্প';
    if (n.includes('সমকামী')) return 'সমকামী বাংলা চটি গল্প';
    if (n.includes('সেরা')) return 'সেরা বাংলা চটি';
    if (n.includes('স্টুডেন্ট')) return 'স্টুডেন্ট বাংলা চটি গল্প';
    if (n.includes('স্বামী স্ত্রী') || n.includes('স্বামী-স্ত্রী')) return 'স্বামী স্ত্রী বাংলা চটি গল্প';
    if (n.includes('হিজরা')) return 'হিজরা শীলে বাংলা চটি গল্প';
    return name;
  }

  async function showCategoryMenu(e) {
    if (e) e.preventDefault();
    const overlay = document.getElementById('categoryOverlay');
    const menu = document.getElementById('categoryMenu');
    const nav = document.getElementById('categoryNavBtn');
    const rect = nav.getBoundingClientRect();
    menu.style.top = `${Math.min(rect.bottom, window.innerHeight - 120)}px`;
    menu.style.left = `${Math.max(10, Math.min(rect.left, window.innerWidth - Math.min(360, window.innerWidth - 20) - 10))}px`;
    overlay.classList.add('open');
    menu.innerHTML = '<div class="category-menu-title">বিভাগ</div><div class="cat-loading">বিভাগ লোড হচ্ছে...</div>';

    const fixedCategories = [
      ['ojachar','অজাচার বাংলা চটি গল্প'],
      ['kajer-mashi','কাজের মাসি চোদার গল্প'],
      ['kajer-meye','কাজের মেয়ে চোদার গল্প'],
      ['kumari-meye','কুমারী মেয়ে চোদার গল্প'],
      ['grihobodhu','গৃহবধূ চোদন কাহিনী'],
      ['gay','গে সেক্স চটি'],
      ['gram-sex','গ্রাম সেক্সের বাংলা চটি গল্প'],
      ['porkiya','পরকীয়া বাংলা চটি গল্প'],
      ['mature','পরিপক্ক চোদাচুদি গল্প'],
      ['protibeshi','প্রতিবেশী চোদার চটি গল্প'],
      ['famous','ফেমাস বাংলা চটি গল্প'],
      ['babaji','বাবাজী চোদার বাংলা চটি গল্প'],
      ['somokami','সমকামী বাংলা চটি গল্প'],
      ['best','সেরা বাংলা চটি'],
      ['student','স্টুডেন্ট বাংলা চটি গল্প'],
      ['swami-stri','স্বামী স্ত্রী বাংলা চটি গল্প'],
      ['hijra','হিজরা শীলে বাংলা চটি গল্প']
    ];

    const items = fixedCategories.map(([slug,name]) => `
      <button class="${currentCat === slug ? 'active' : ''}" onclick="selectCategory('${slug}')">${escapeHTML(name)}</button>
    `).join('');

    menu.innerHTML = `
      <div class="category-menu-title">বিভাগ</div>
      <button class="${!currentCat ? 'active' : ''}" onclick="selectCategory('')">সব গল্প</button>
      ${items}
    `;
  }

  function selectCategory(slug) {
    closeCategoryMenu();
    filterCat(slug);
    const url = slug ? `/?category=${encodeURIComponent(slug)}` : '/';
    history.replaceState({category: slug}, '', url);
    window.scrollTo({top: 0, behavior: 'smooth'});
  }

  function closeCategoryMenu(e) {
    if (e && e.target !== document.getElementById('categoryOverlay')) return;
    document.getElementById('categoryOverlay').classList.remove('open');
  }

  // ===== FILTER BY CATEGORY =====
  function filterCat(cat, btn) {
    currentCat = cat;
    // Update active filter tag
    if (btn) {
      document.querySelectorAll('.filter-tag').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
    }
    loadStories(1, cat, currentSearch);
  }

  // ===== SEARCH =====
  function doSearch() {
    const q = document.getElementById('searchInput').value.trim();
    loadStories(1, currentCat, q);
  }
  document.getElementById('searchInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') doSearch();
  });

  // ===== DARK MODE =====
  document.getElementById('darkToggle').addEventListener('click', () => {
    document.body.classList.toggle('dark');
    const isDark = document.body.classList.contains('dark');
    document.getElementById('darkToggle').textContent = isDark ? '☀️' : '🌙';
    localStorage.setItem('darkMode', isDark);
  });
  if (localStorage.getItem('darkMode') === 'true') {
    document.body.classList.add('dark');
    document.getElementById('darkToggle').textContent = '☀️';
  }

  // ===== BOOKMARK =====
  function toggleBookmark(e, id) {
    e.stopPropagation();
    const btn = e.currentTarget;
    btn.classList.toggle('saved');
    let saved = JSON.parse(localStorage.getItem('bookmarks') || '[]');
    if (btn.classList.contains('saved')) {
      saved.push(id);
    } else {
      saved = saved.filter(s => s !== id);
    }
    localStorage.setItem('bookmarks', JSON.stringify(saved));
  }

  // ===== INIT =====
  const initialCategory = new URLSearchParams(window.location.search).get('category') || '';
  currentCat = initialCategory;
  loadStories(1, initialCategory, '');
</script>
