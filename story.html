<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Hind Siliguri',sans-serif;background:#f5faf7;color:#1a1a2e;min-height:100vh}.top{position:sticky;top:0;z-index:10;background:#fff;border-bottom:2px solid #d4e8dc;padding:12px 16px;display:flex;align-items:center;gap:12px}.back{border:0;background:#e8f5ee;color:#1a5c38;border-radius:22px;padding:8px 14px;font-family:inherit;font-weight:600;cursor:pointer;font-size:14px}.brand{font-weight:700;color:#1a5c38;font-size:18px}.wrap{max-width:800px;margin:0 auto;padding:18px 14px 40px}.breadcrumb{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:13px;color:#777;margin-bottom:10px}.breadcrumb a{color:#217a47;text-decoration:none;font-weight:600}.article{background:#fff;border:1px solid #d4e8dc;border-radius:16px;overflow:hidden;box-shadow:0 2px 12px rgba(33,122,71,.10)}.head{padding:22px 20px 12px}.title{font-size:28px;line-height:1.35;color:#1a5c38;font-weight:700}.meta{display:flex;gap:12px;flex-wrap:wrap;color:#888;font-size:13px;margin-top:10px}.cats{display:block;margin-top:12px;font-size:15px;line-height:1.9;color:#217a47}.cat{border:0;background:transparent;color:#217a47;padding:0;margin:0;font-family:inherit;font-size:15px;font-weight:500;cursor:pointer}.cat:hover{text-decoration:underline}.cat+.cat::before{content:', ';color:#888}.category-end{margin:0 20px 22px;padding-top:16px;border-top:1px solid #d4e8dc}.category-title{font-size:18px;color:#1a5c38;font-weight:700;margin-bottom:7px}.category-list{font-size:15px;line-height:1.9;color:#217a47}.series-box{margin:4px 20px 24px;padding:18px 0 0;border-top:1px solid #d4e8dc}.series-title{font-size:18px;color:#1a5c38;font-weight:700;margin-bottom:10px}.series-list{margin:0;padding-left:28px}.related-title{margin-top:18px}.series-list li{padding:5px 0;color:#444;font-size:16px;line-height:1.55}.series-list a{color:#217a47;text-decoration:none;font-weight:600}.series-list a:hover{text-decoration:underline}.cover{width:100%;max-height:420px;object-fit:cover;display:block}.content{padding:22px 20px;font-size:17px;line-height:2;color:#222;overflow-wrap:anywhere}.content p{margin-bottom:14px}.content img{max-width:100%;height:auto;border-radius:10px;display:block;margin:12px auto}.loading{background:#fff;border:1px solid #d4e8dc;border-radius:16px;text-align:center;padding:60px 20px;color:#777}.error{background:#fff;border:1px solid #ead1d1;border-radius:16px;text-align:center;padding:60px 20px;color:#c62828;box-shadow:0 2px 12px rgba(0,0,0,.05)}.error-icon{font-size:42px;margin-bottom:10px}.error-text{font-size:17px;font-weight:600}.home{display:inline-block;margin-top:18px;background:#217a47;color:#fff;text-decoration:none;padding:10px 18px;border-radius:24px;font-weight:600}.foot{text-align:center;color:#777;padding:20px;font-size:13px}@media(max-width:600px){.top{padding:10px 12px}.brand{font-size:16px}.wrap{padding:12px 10px 30px}.article{border-radius:13px}.title{font-size:22px}.head{padding:18px 15px 12px}.content{font-size:16px;line-height:1.95;padding:18px 15px}.meta{font-size:12px;gap:8px}.cover{max-height:300px}}
</style>
</head>
<body>
<header class="top"><button class="back" onclick="goHome()" aria-label="হোমে ফিরে যান">← হোম</button><div class="brand">Bangla Choti Kahinii 🌿</div></header>
<main class="wrap">
  <nav id="breadcrumb" class="breadcrumb" aria-label="Breadcrumb"><a href="/">হোম</a><span>›</span><span>গল্প</span></nav>
  <div id="app" class="loading">গল্প লোড হচ্ছে...</div>
</main>
<footer class="foot">🌿 গল্প পড়ুন, কল্পনার জগতে হারিয়ে যান...</footer>
<script>
const API='https://choti.onrender.com';
function goHome(){window.location.href='/';}
function escapeHTML(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
function absoluteUrl(value){try{return new URL(value,window.location.origin).href}catch(e){return String(value||'');}}
function stripHtml(value){const t=document.createElement('div');t.innerHTML=String(value||'');return (t.textContent||t.innerText||'').replace(/\s+/g,' ').trim();}
function makeDescription(story){let d=String(story.excerpt||'').trim();if(!d)d=stripHtml(story.content).slice(0,155);return d||`${story.title||'বাংলা গল্প'} গল্পটি Bangla Choti Kahinii-তে পড়ুন।`;}
function setMeta(name,content){let el=document.querySelector(`meta[name="${name}"]`);if(el)el.setAttribute('content',content);}
function setProp(id,content){const el=document.getElementById(id);if(el)el.setAttribute('content',content);}
function setStorySEO(story){
  const title=String(story.title||'বাংলা গল্প').trim();
  const description=makeDescription(story);
  const canonicalUrl=story.slug?`https://banglachoti.pages.dev/${encodeURIComponent(story.slug)}/`:window.location.href.split('?')[0];
  document.title=`${title} | Bangla Choti Kahinii`;
  setMeta('description',description);
  const canonical=document.getElementById('canonicalLink');if(canonical)canonical.href=canonicalUrl;
  setProp('ogTitle',title);setProp('ogDescription',description);setProp('ogUrl',canonicalUrl);if(story.image)setProp('ogImage',absoluteUrl(story.image));
  setProp('twitterTitle',title);setProp('twitterDescription',description);if(story.image)setProp('twitterImage',absoluteUrl(story.image));
  document.querySelectorAll('script[data-story-schema]').forEach(el=>el.remove());
  const schema={"@context":"https://schema.org","@type":"Article","@id":canonicalUrl+'#article',"headline":title,"description":description,"url":canonicalUrl,"inLanguage":"bn-BD","isAccessibleForFree":true,"mainEntityOfPage":{"@type":"WebPage","@id":canonicalUrl},"author":{"@type":"Person","name":story.author||'Bangla Choti Kahinii'},"publisher":{"@type":"Organization","name":"Bangla Choti Kahinii","url":"https://banglachoti.pages.dev/"}};
  if(story.createdAt)schema.datePublished=new Date(story.createdAt).toISOString();
  if(story.updatedAt)schema.dateModified=new Date(story.updatedAt).toISOString();else if(story.createdAt)schema.dateModified=new Date(story.createdAt).toISOString();
  if(story.image)schema.image=[absoluteUrl(story.image)];
  const s=document.createElement('script');s.type='application/ld+json';s.setAttribute('data-story-schema','true');s.textContent=JSON.stringify(schema);document.head.appendChild(s);
  const breadcrumb=document.getElementById('breadcrumb');if(breadcrumb)breadcrumb.innerHTML=`<a href="/">হোম</a><span>›</span><span>${escapeHTML(title)}</span>`;
}
async function getCategories(){try{const r=await fetch(`${API}/api/categories`);return r.ok?await r.json():[]}catch(e){return[]}}
async function getStoryLinks(id){try{const r=await fetch(`${API}/api/stories/related/${encodeURIComponent(id)}`);return r.ok?await r.json():{series:{parts:[]},related:[]}}catch(e){return{series:{parts:[]},related:[]}}}
function categoryMap(list){const m={};(list||[]).forEach(c=>m[c.slug]=c);return m;}
function openCategory(slug){if(slug)window.location.href=`/?category=${encodeURIComponent(slug)}`;}
function storyLink(item){if(item.slug)return `/${encodeURIComponent(item.slug)}/`;return `/story.html?id=${encodeURIComponent(item._id)}`;}
function showError(){const app=document.getElementById('app');app.className='error';app.innerHTML='<div class="error-icon">⚠️</div><div class="error-text">গল্পটি পাওয়া যায়নি।</div><a class="home" href="/">← হোমে ফিরে যান</a>';}
async function loadStory(){
  const app=document.getElementById('app');
  const parts=window.location.pathname.split('/').filter(Boolean);const pathPart=parts.length?decodeURIComponent(parts[parts.length-1]):'';const params=new URLSearchParams(window.location.search);const querySlug=params.get('slug');const oldId=params.get('id');const isPlaceholder=!pathPart||pathPart==='story'||pathPart==='story.html'||pathPart==='index.html';
  try{
    let url;if(querySlug)url=`${API}/api/stories/slug/${encodeURIComponent(querySlug)}`;else if(!isPlaceholder)url=`${API}/api/stories/slug/${encodeURIComponent(pathPart)}`;else if(oldId)url=`${API}/api/stories/${encodeURIComponent(oldId)}`;else throw new Error('Missing story identifier');
    const res=await fetch(url,{headers:{Accept:'application/json'}});if(!res.ok)throw new Error('Story not found');const story=await res.json();
    setStorySEO(story);
    const date=story.createdAt?new Date(story.createdAt).toLocaleDateString('bn-BD'):'';const cats=await getCategories();const cmap=categoryMap(cats);
    const catHtml=(story.categories||[]).map(slug=>{const c=cmap[slug]||{name:slug};const safe=String(slug).replace(/'/g,"\\'");return `<button class="cat" onclick="openCategory('${safe}')">${escapeHTML(c.name||slug)}</button>`}).join('');
    const links=await getStoryLinks(story._id);const partsList=links.series&&Array.isArray(links.series.parts)?links.series.parts:[];const relatedList=Array.isArray(links.related)?links.related:[];
    const optionItems=partsList.map((item,i)=>`<li><a href="${escapeHTML(storyLink(item))}">${escapeHTML(item.title||`পর্ব ${item.part||i+1}`)}</a></li>`).join('');
    const relatedItems=relatedList.map(item=>`<li><a href="${escapeHTML(storyLink(item))}">${escapeHTML(item.title||'গল্প')}</a></li>`).join('');
    let linksHtml='';if(partsList.length)linksHtml+=`<section class="series-box"><div class="series-title">এই গল্পের অন্যান্য পর্ব</div><ol class="series-list">${optionItems}</ol></section>`;if(relatedList.length&&partsList.length<4)linksHtml+=`<section class="series-box"><div class="series-title related-title">আরও অন্যান্য গল্প</div><ol class="series-list">${relatedItems}</ol></section>`;if(!partsList.length&&relatedList.length)linksHtml=`<section class="series-box"><div class="series-title">আরও অন্যান্য গল্প</div><ol class="series-list">${relatedItems}</ol></section>`;
    const categoryHtml=catHtml?`<section class="category-end"><div class="category-title">ক্যাটাগরি</div><div class="category-list">${catHtml}</div></section>`:'';
    const image=story.image?`<img class="cover" src="${escapeHTML(story.image)}" alt="${escapeHTML(story.title||'বাংলা গল্প')}" loading="eager" fetchpriority="high" decoding="async">`:'';
    app.className='article';app.innerHTML=`<div class="head"><h1 class="title">${escapeHTML(story.title||'গল্প')}</h1><div class="meta"><span>👤 ${escapeHTML(story.author||'অজ্ঞাত')}</span>${date?`<span>📅 ${date}</span>`:''}<span>👁 ${(Number(story.views)||0).toLocaleString('bn-BD')}</span></div></div>${image}<article class="content" itemscope itemtype="https://schema.org/Article">${story.content||''}</article>${categoryHtml}${linksHtml}`;
  }catch(e){console.error(e);showError();}
}
loadStory();
</script>
</body>
