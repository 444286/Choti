<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111111">
  <title>গল্প | বাংলা চটি কাহিনী</title>
  <meta name="description" content="বাংলা গল্প পড়ুন।">
  <style>
    *{box-sizing:border-box}body{margin:0;background:#0b0b0b;color:#eee;font-family:Arial,'Noto Sans Bengali',sans-serif;line-height:1.8}.wrap{max-width:820px;margin:auto;padding:14px}.top{position:sticky;top:0;z-index:5;background:#111;border-bottom:1px solid #292929;padding:10px 14px;display:flex;align-items:center;gap:10px}.back{border:0;background:#222;color:#fff;border-radius:9px;padding:8px 13px;cursor:pointer}.brand{font-weight:700;font-size:16px}.card{margin-top:16px;background:#121212;border:1px solid #292929;border-radius:16px;overflow:hidden}.hero{width:100%;max-height:430px;object-fit:cover;display:block}.body{padding:20px}.title{font-size:28px;line-height:1.35;margin:0 0 10px;font-weight:800}.meta{display:flex;flex-wrap:wrap;gap:10px;color:#aaa;font-size:13px;border-bottom:1px solid #292929;padding-bottom:14px;margin-bottom:18px}.content{font-size:17px;color:#eee;overflow-wrap:anywhere}.content p{margin:0 0 18px}.content img{max-width:100%;height:auto;border-radius:10px}.loading{text-align:center;padding:60px 15px;color:#aaa}.error{text-align:center;padding:50px 15px;color:#ff7777}.share{margin-top:20px;padding-top:16px;border-top:1px solid #292929;display:flex;gap:8px}.share button{border:0;border-radius:9px;padding:9px 14px;background:#222;color:#fff;cursor:pointer}@media(max-width:600px){.title{font-size:23px}.content{font-size:16px}.body{padding:15px}}
  </style>
</head>
<body>
  <div class="top"><button class="back" onclick="goBack()">← ফিরে যান</button><div class="brand">বাংলা চটি কাহিনী</div></div>
  <main class="wrap"><div id="app" class="card"><div class="loading">গল্প লোড হচ্ছে...</div></div></main>
<script>
const API='https://choti.onrender.com';
function escapeHTML(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function getSlug(){const parts=window.location.pathname.split('/').filter(Boolean);return parts.length?decodeURIComponent(parts[parts.length-1]):'';}
function goBack(){if(history.length>1) history.back(); else window.location.href='/';}
async function loadStory(){
  const app=document.getElementById('app');
  const slug=getSlug();
  const oldId=new URLSearchParams(location.search).get('id');
  try{
    let url;
    if(slug && slug!=='story.html') url=`${API}/api/stories/slug/${encodeURIComponent(slug)}`;
    else if(oldId) url=`${API}/api/stories/${encodeURIComponent(oldId)}`;
    else throw new Error('Story URL missing');
    const res=await fetch(url);
    const story=await res.json();
    if(!res.ok) throw new Error(story.error||'গল্প পাওয়া যায়নি');
    document.title=`${story.title} | বাংলা চটি কাহিনী`;
    const date=new Date(story.createdAt).toLocaleDateString('bn-BD',{day:'2-digit',month:'long',year:'numeric'});
    app.innerHTML=`<article>${story.image?`<img class="hero" src="${escapeHTML(story.image)}" alt="${escapeHTML(story.title)}">`:''}<div class="body"><h1 class="title">${escapeHTML(story.title)}</h1><div class="meta"><span>👤 ${escapeHTML(story.author||'অজ্ঞাত')}</span><span>📅 ${date}</span><span>👁 ${(story.views||0).toLocaleString('bn-BD')}</span></div><div class="content">${story.content||''}</div><div class="share"><button onclick="shareStory()">🔗 শেয়ার করুন</button></div></div></article>`;
  }catch(e){app.innerHTML=`<div class="error">❌ ${escapeHTML(e.message||'গল্প লোড করতে সমস্যা হয়েছে।')}<br><br><button class="back" onclick="window.location.href='/'">হোমে ফিরুন</button></div>`;}
}
async function shareStory(){try{await navigator.share({title:document.title,url:location.href});}catch(e){try{await navigator.clipboard.writeText(location.href);alert('লিংক কপি হয়েছে!');}catch(x){alert(location.href);}}}
loadStory();
</script>
</body>
</html>
