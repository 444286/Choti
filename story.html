<script>

const API =
  'https://choti.onrender.com';


// =====================================================
// BASIC HELPERS
// =====================================================

function goHome(){

  window.location.href = '/';

}


function escapeHTML(value){

  return String(value ?? '')
    .replace(
      /[&<>"']/g,
      match => ({
        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        '"':'&quot;',
        "'":'&#039;'
      }[match])
    );

}


function absoluteUrl(value){

  try{

    return new URL(
      value,
      window.location.origin
    ).href;

  }catch(e){

    return String(
      value || ''
    );

  }

}


function stripHtml(value){

  const temp =
    document.createElement('div');

  temp.innerHTML =
    String(value || '');

  return (
    temp.textContent ||
    temp.innerText ||
    ''
  )
    .replace(/\s+/g,' ')
    .trim();

}


function makeDescription(story){

  let description =
    String(
      story.excerpt || ''
    ).trim();

  if(!description){

    description =
      stripHtml(
        story.content
      ).slice(0,155);

  }

  return (
    description ||
    `${story.title || 'বাংলা গল্প'} গল্পটি Bangla Choti Kahinii-তে পড়ুন।`
  );

}


// =====================================================
// META
// =====================================================

function setMeta(
  name,
  content
){

  const el =
    document.querySelector(
      `meta[name="${name}"]`
    );

  if(el){

    el.setAttribute(
      'content',
      content
    );

  }

}


function setProp(
  id,
  content
){

  const el =
    document.getElementById(id);

  if(el){

    el.setAttribute(
      'content',
      content
    );

  }

}


// =====================================================
// STORY SEO
// =====================================================

function setStorySEO(story){

  const title =
    String(
      story.title ||
      'বাংলা গল্প'
    ).trim();

  const description =
    makeDescription(story);

  let canonicalUrl;

  if(story.slug){

    canonicalUrl =
      `https://banglachoti.pages.dev/${encodeURIComponent(story.slug)}/`;

  }else{

    canonicalUrl =
      `${window.location.origin}${window.location.pathname}`;

  }


  document.title =
    `${title} | Bangla Choti Kahinii`;


  setMeta(
    'description',
    description
  );


  const canonical =
    document.getElementById(
      'canonicalLink'
    );

  if(canonical){

    canonical.href =
      canonicalUrl;

  }


  setProp(
    'ogTitle',
    title
  );

  setProp(
    'ogDescription',
    description
  );

  setProp(
    'ogUrl',
    canonicalUrl
  );


  if(story.image){

    setProp(
      'ogImage',
      absoluteUrl(
        story.image
      )
    );

  }


  setProp(
    'twitterTitle',
    title
  );

  setProp(
    'twitterDescription',
    description
  );


  if(story.image){

    setProp(
      'twitterImage',
      absoluteUrl(
        story.image
      )
    );

  }


  document
    .querySelectorAll(
      'script[data-story-schema]'
    )
    .forEach(
      el => el.remove()
    );


  const schema = {

    '@context':
      'https://schema.org',

    '@type':
      'Article',

    '@id':
      `${canonicalUrl}#article`,

    headline:
      title,

    description:
      description,

    url:
      canonicalUrl,

    inLanguage:
      'bn-BD',

    isAccessibleForFree:
      true,

    mainEntityOfPage:{
      '@type':
        'WebPage',

      '@id':
        canonicalUrl
    },

    author:{
      '@type':
        'Person',

      name:
        story.author ||
        'Bangla Choti Kahinii'
    },

    publisher:{
      '@type':
        'Organization',

      name:
        'Bangla Choti Kahinii',

      url:
        'https://banglachoti.pages.dev/'
    }

  };


  if(story.createdAt){

    schema.datePublished =
      new Date(
        story.createdAt
      ).toISOString();

  }


  if(story.updatedAt){

    schema.dateModified =
      new Date(
        story.updatedAt
      ).toISOString();

  }else if(story.createdAt){

    schema.dateModified =
      new Date(
        story.createdAt
      ).toISOString();

  }


  if(story.image){

    schema.image = [
      absoluteUrl(
        story.image
      )
    ];

  }


  const script =
    document.createElement(
      'script'
    );

  script.type =
    'application/ld+json';

  script.setAttribute(
    'data-story-schema',
    'true'
  );

  script.textContent =
    JSON.stringify(schema);

  document.head.appendChild(
    script
  );


  const breadcrumb =
    document.getElementById(
      'breadcrumb'
    );

  if(breadcrumb){

    breadcrumb.innerHTML =
      `
      <a href="/">হোম</a>
      <span>›</span>
      <span>${escapeHTML(title)}</span>
      `;

  }

}


// =====================================================
// GET CATEGORIES
// =====================================================

async function getCategories(){

  try{

    const response =
      await fetch(
        `${API}/api/categories`,
        {
          headers:{
            Accept:
              'application/json'
          },

          cache:'no-store'
        }
      );


    if(!response.ok){

      return [];

    }


    const data =
      await response.json();


    return Array.isArray(data)
      ? data
      : [];

  }catch(error){

    console.error(
      'Category error:',
      error
    );

    return [];

  }

}


// =====================================================
// GET RELATED
// =====================================================

async function getStoryLinks(id){

  try{

    const response =
      await fetch(
        `${API}/api/stories/related/${encodeURIComponent(id)}`,
        {
          headers:{
            Accept:
              'application/json'
          },

          cache:'no-store'
        }
      );


    if(!response.ok){

      return {
        series:{
          parts:[]
        },

        related:[]
      };

    }


    const data =
      await response.json();


    return data || {

      series:{
        parts:[]
      },

      related:[]
    };


  }catch(error){

    console.error(
      'Related stories error:',
      error
    );

    return {

      series:{
        parts:[]
      },

      related:[]
    };

  }

}


// =====================================================
// CATEGORY MAP
// =====================================================

function categoryMap(list){

  const map = {};

  (list || []).forEach(
    category => {

      if(
        category &&
        category.slug
      ){

        map[
          category.slug
        ] = category;

      }

    }
  );

  return map;

}


// =====================================================
// OPEN CATEGORY
// =====================================================

function openCategory(slug){

  if(slug){

    window.location.href =
      `/?category=${encodeURIComponent(slug)}`;

  }

}


// =====================================================
// STORY LINK
// =====================================================

function storyLink(item){

  if(
    item &&
    item.slug
  ){

    return `/${encodeURIComponent(item.slug)}/`;

  }


  if(
    item &&
    item._id
  ){

    return `/story.html?id=${encodeURIComponent(item._id)}`;

  }


  return '/';

}


// =====================================================
// ERROR
// =====================================================

function showError(){

  const app =
    document.getElementById(
      'app'
    );


  app.className =
    'error';


  app.innerHTML =
    `
    <div class="error-icon">
      ⚠️
    </div>

    <div class="error-text">
      গল্পটি পাওয়া যায়নি।
    </div>

    <a
      class="home"
      href="/"
    >
      ← হোমে ফিরে যান
    </a>
    `;

}


// =====================================================
// GET STORY BY SLUG
// =====================================================

async function getStoryBySlug(slug){

  if(!slug){

    return null;

  }


  const cleanSlug =
    String(slug)
      .trim()
      .replace(/^\/+|\/+$/g,'');


  if(!cleanSlug){

    return null;

  }


  const url =
    `${API}/api/stories/slug/${encodeURIComponent(cleanSlug)}`;


  console.log(
    '🔎 Story slug:',
    cleanSlug
  );


  console.log(
    '🌐 API:',
    url
  );


  try{

    const response =
      await fetch(
        url,
        {
          method:'GET',

          headers:{
            Accept:
              'application/json'
          },

          cache:'no-store'
        }
      );


    if(response.ok){

      const data =
        await response.json();


      if(
        data &&
        data._id
      ){

        return data;

      }

    }


    console.warn(
      'Slug API failed:',
      response.status
    );


  }catch(error){

    console.error(
      'Slug API error:',
      error
    );

  }


  return null;

}


// =====================================================
// FALLBACK STORY SEARCH
// =====================================================

async function findStoryFallback(slug){

  try{

    const response =
      await fetch(
        `${API}/api/stories?limit=100&page=1`,
        {
          method:'GET',

          headers:{
            Accept:
              'application/json'
          },

          cache:'no-store'
        }
      );


    if(!response.ok){

      return null;

    }


    const data =
      await response.json();


    let stories = [];


    if(Array.isArray(data)){

      stories = data;

    }else if(
      data &&
      Array.isArray(
        data.stories
      )
    ){

      stories =
        data.stories;

    }


    const target =
      String(slug)
        .trim();


    const found =
      stories.find(
        item =>
          String(
            item.slug || ''
          ).trim() === target
      );


    if(
      found &&
      found._id
    ){

      console.log(
        '✅ Fallback story found:',
        found._id
      );


      try{

        const idResponse =
          await fetch(
            `${API}/api/stories/${encodeURIComponent(found._id)}`,
            {
              headers:{
                Accept:
                  'application/json'
              },

              cache:'no-store'
            }
          );


        if(idResponse.ok){

          const fullStory =
            await idResponse.json();


          if(
            fullStory &&
            fullStory._id
          ){

            return fullStory;

          }

        }

      }catch(error){

        console.warn(
          'ID fallback failed:',
          error
        );

      }


      return found;

    }


  }catch(error){

    console.error(
      'Fallback list error:',
      error
    );

  }


  return null;

}


// =====================================================
// LOAD STORY
// =====================================================

async function loadStory(){

  const app =
    document.getElementById(
      'app'
    );


  try{

    const pathname =
      window.location.pathname;


    console.log(
      '📍 Current pathname:',
      pathname
    );


    const parts =
      pathname
        .split('/')
        .filter(Boolean);


    let pathPart = '';


    if(parts.length){

      pathPart =
        parts[parts.length - 1];

    }


    try{

      pathPart =
        decodeURIComponent(
          pathPart
        );

    }catch(e){

      console.warn(
        'URL decode failed:',
        e
      );

    }


    const params =
      new URLSearchParams(
        window.location.search
      );


    const querySlug =
      params.get('slug');


    const oldId =
      params.get('id');


    const isPlaceholder =
      !pathPart ||
      pathPart === 'story' ||
      pathPart === 'story.html' ||
      pathPart === 'index.html';


    let requestedSlug =
      querySlug ||
      (
        !isPlaceholder
          ? pathPart
          : ''
      );


    if(requestedSlug){

      requestedSlug =
        String(
          requestedSlug
        )
        .trim()
        .replace(
          /^\/+|\/+$/g,
          ''
        );

    }


    console.log(
      '🎯 Requested slug:',
      requestedSlug
    );


    let story = null;


    // =================================================
    // 1. SLUG API
    // =================================================

    if(requestedSlug){

      story =
        await getStoryBySlug(
          requestedSlug
        );

    }


    // =================================================
    // 2. FALLBACK STORY LIST
    // =================================================

    if(
      !story &&
      requestedSlug
    ){

      console.log(
        '↪ Trying fallback story list...'
      );


      story =
        await findStoryFallback(
          requestedSlug
        );

    }


    // =================================================
    // 3. OLD ID URL
    // =================================================

    if(
      !story &&
      oldId
    ){

      try{

        const idUrl =
          `${API}/api/stories/${encodeURIComponent(oldId)}`;


        const response =
          await fetch(
            idUrl,
            {
              method:'GET',

              headers:{
                Accept:
                  'application/json'
              },

              cache:'no-store'
            }
          );


        if(response.ok){

          story =
            await response.json();

        }

      }catch(error){

        console.error(
          'ID API error:',
          error
        );

      }

    }


    // =================================================
    // NOT FOUND
    // =================================================

    if(
      !story ||
      !story._id
    ){

      throw new Error(
        'Story not found'
      );

    }


    // =================================================
    // SEO
    // =================================================

    setStorySEO(
      story
    );


    // =================================================
    // DATE
    // =================================================

    const date =
      story.createdAt
        ? new Date(
            story.createdAt
          ).toLocaleDateString(
            'bn-BD'
          )
        : '';


    // =================================================
    // CATEGORIES
    // =================================================

    const categories =
      await getCategories();


    const categoryLookup =
      categoryMap(
        categories
      );


    const categoryItems =
      Array.isArray(
        story.categories
      )
        ? story.categories
        : [];


    const catHtml =
      categoryItems
        .map(
          slug => {

            const category =
              categoryLookup[
                slug
              ] || {
                name: slug
              };


            const safeSlug =
              String(slug)
                .replace(
                  /\\/g,
                  '\\\\'
                )
                .replace(
                  /'/g,
                  "\\'"
                );


            return `
              <button
                class="cat"
                onclick="openCategory('${safeSlug}')"
              >
                ${escapeHTML(
                  category.name ||
                  slug
                )}
              </button>
            `;

          }
        )
        .join('');


    // =================================================
    // RELATED
    // =================================================

    const links =
      await getStoryLinks(
        story._id
      );


    const partsList =
      links.series &&
      Array.isArray(
        links.series.parts
      )
        ? links.series.parts
        : [];


    const relatedList =
      Array.isArray(
        links.related
      )
        ? links.related
        : [];


    // =================================================
    // SERIES
    // =================================================

    const optionItems =
      partsList
        .map(
          (item,index) => {

            return `
              <li>
                <a
                  href="${escapeHTML(
                    storyLink(item)
                  )}"
                >
                  ${escapeHTML(
                    item.title ||
                    `পর্ব ${item.part || index + 1}`
                  )}
                </a>
              </li>
            `;

          }
        )
        .join('');


    // =================================================
    // RELATED ITEMS
    // =================================================

    const relatedItems =
      relatedList
        .map(
          item => {

            return `
              <li>
                <a
                  href="${escapeHTML(
                    storyLink(item)
                  )}"
                >
                  ${escapeHTML(
                    item.title ||
                    'গল্প'
                  )}
                </a>
              </li>
            `;

          }
        )
        .join('');


    // =================================================
    // LINKS HTML
    // =================================================

    let linksHtml = '';


    if(partsList.length){

      linksHtml += `
        <section class="series-box">

          <div class="series-title">
            এই গল্পের অন্যান্য পর্ব
          </div>

          <ol class="series-list">
            ${optionItems}
          </ol>

        </section>
      `;

    }


    if(
      relatedList.length &&
      partsList.length < 4
    ){

      linksHtml += `
        <section class="series-box">

          <div class="series-title related-title">
            আরও অন্যান্য গল্প
          </div>

          <ol class="series-list">
            ${relatedItems}
          </ol>

        </section>
      `;

    }


    if(
      !partsList.length &&
      relatedList.length
    ){

      linksHtml = `
        <section class="series-box">

          <div class="series-title">
            আরও অন্যান্য গল্প
          </div>

          <ol class="series-list">
            ${relatedItems}
          </ol>

        </section>
      `;

    }


    // =================================================
    // CATEGORY HTML
    // =================================================

    const categoryHtml =
      catHtml
        ? `
          <section class="category-end">

            <div class="category-title">
              ক্যাটাগরি
            </div>

            <div class="category-list">
              ${catHtml}
            </div>

          </section>
        `
        : '';


    // =================================================
    // COVER
    // =================================================

    const image =
      story.image
        ? `
          <img
            class="cover"
            src="${escapeHTML(
              story.image
            )}"
            alt="${escapeHTML(
              story.title ||
              'বাংলা গল্প'
            )}"
            loading="eager"
            fetchpriority="high"
            decoding="async"
          >
        `
        : '';


    // =================================================
    // RENDER
    // =================================================

    app.className =
      'article';


    app.innerHTML =
      `
      <div class="head">

        <h1 class="title">
          ${escapeHTML(
            story.title ||
            'গল্প'
          )}
        </h1>


        <div class="meta">

          <span>
            👤
            ${escapeHTML(
              story.author ||
              'অজ্ঞাত'
            )}
          </span>


          ${
            date
              ? `
                <span>
                  📅 ${date}
                </span>
              `
              : ''
          }


          <span>
            👁
            ${
              (
                Number(
                  story.views
                ) || 0
              ).toLocaleString(
                'bn-BD'
              )
            }
          </span>

        </div>

      </div>


      ${image}


      <article
        class="content"
        itemscope
        itemtype="https://schema.org/Article"
      >
        ${story.content || ''}
      </article>


      ${categoryHtml}


      ${linksHtml}
      `;


  }catch(error){

    console.error(
      '❌ Story loading error:',
      error
    );


    showError();

  }

}


// =====================================================
// START
// =====================================================

loadStory();

</script>

</body>
  </html>
