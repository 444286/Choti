<script>
const firebaseConfig = {apiKey:"AIzaSyDrh0lGli15t7zj8WnWrhjb4hs-mKPmFlU",authDomain:"jobs-33e35.firebaseapp.com",databaseURL:"https://jobs-33e35-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"jobs-33e35",storageBucket:"jobs-33e35.firebasestorage.app",messagingSenderId:"1058905507108",appId:"1:1058905507108:web:f529c961c7e5fcbb379fb1"};
firebase.initializeApp(firebaseConfig); const db=firebase.database();

function goHomeSearch(){window.location.href='/?search=';}
let categoryList=[];
async function loadHeaderCategories(){try{const s=await db.ref('categories').once('value');categoryList=Object.entries(s.val()||{}).map(([id,c])=>({...c,_id:c._id||id}));}catch(e){categoryList=[];}renderHeaderCategories();}
function renderHeaderCategories(){
  const list=document.getElementById('categoryOverlayList');
  if(!list)return;
  const items=[`<button type="button" class="category-overlay-item active" onclick="selectHeaderCategory('')">📚 <span>সব গল্প</span></button>`];
  categoryList.forEach(c=>{
    if(!c||!c.slug)return;
    const slug=String(c.slug).replace(/'/g, "\\'");
    items.push(`<button type="button" class="category-overlay-item" onclick="selectHeaderCategory('${slug}')">${escapeHTML(c.icon||'📖')} <span>${escapeHTML(c.name||c.slug)}</span></button>`);
  });
  list.innerHTML=items.length?items.join(''):`<div class="category-overlay-empty">কোনো বিভাগ পাওয়া যায়নি।</div>`;
}

function toggleCategoryOverlay(force){const overlay=document.getElementById('categoryOverlay');const panel=document.querySelector('#categoryOverlay .category-panel');const navBtn=document.getElementById('categoryNavBtn');if(!overlay||!panel)return;const open=typeof force==='boolean'?force:!overlay.classList.contains('open');if(open){renderHeaderCategories();overlay.classList.add('open');document.body.classList.add('category-menu-open');const nav=document.querySelector('.nav');const target=navBtn||nav;if(target){const rect=target.getBoundingClientRect();const navRect=nav?nav.getBoundingClientRect():rect;panel.style.top=`${Math.round(navRect.bottom)}px`;let left=Math.round(rect.left);const maxLeft=window.innerWidth-panel.getBoundingClientRect().width-6;panel.style.left=`${Math.max(0,Math.min(left,maxLeft))}px`;}}else{overlay.classList.remove('open');document.body.classList.remove('category-menu-open');panel.style.top='';panel.style.left='';if(navBtn)navBtn.classList.remove('active');const hb=document.getElementById('hamburgerBtn');if(hb)hb.classList.remove('active');}}
function closeCategoryOverlay(e){if(e&&e.target!==e.currentTarget)return;toggleCategoryOverlay(false);}
function selectHeaderCategory(slug){toggleCategoryOverlay(false);window.location.href=slug?`/?category=${encodeURIComponent(slug)}`:'/';}
function escapeHTML(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
function stripHTML(v){const d=document.createElement('div');d.innerHTML=String(v||'');return (d.textContent||d.innerText||'').replace(/\s+/g,' ').trim();}
function absUrl(v){try{return new URL(v,window.location.origin).href;}catch(e){return String(v||'');}}
function setSEO(story){
  const title=String(story.title||'বাংলা গল্প').trim();
  const desc=String(story.excerpt||stripHTML(story.content).slice(0,160)||`${title} গল্পটি Bangla Choti Kahinii-তে পড়ুন।`).trim();
  // Use admin's postLink as-is for canonical URL
  let _cl=String(story.postLink||story.customLink||story.manualLink||'').trim();
  if(/^https?:\/\//i.test(_cl)){try{_cl=new URL(_cl).pathname.replace(/^\/+|\/+$/g,'');}catch(e){}}
  else{try{_cl=decodeURIComponent(_cl);}catch(e){}_cl=_cl.replace(/^\/+|\/+$/g,'');}
  const canonical=`https://banglachoti.pages.dev/${_cl.split('/').map(encodeURIComponent).join('/')}`;
  document.title=`${title} | Bangla Choti Kahinii`;
  const md=document.querySelector('meta[name="description"]'); if(md) md.content=desc;
  const c=document.getElementById('canonicalLink'); if(c)c.href=canonical;
  const props={ogTitle:title,ogDescription:desc,ogUrl:canonical,twitterTitle:title,twitterDescription:desc};
  if(story.image){props.ogImage=absUrl(story.image);props.twitterImage=absUrl(story.image);}
  Object.entries(props).forEach(([id,v])=>{const e=document.getElementById(id);if(e)e.setAttribute('content',v);});
  document.querySelectorAll('script[data-story-schema]').forEach(e=>e.remove());
  const schema={'@context':'https://schema.org','@graph':[{'@type':'Article','@id':canonical+'#article','headline':title,'description':desc,'url':canonical,'inLanguage':'bn-BD','isAccessibleForFree':true,'mainEntityOfPage':{'@type':'WebPage','@id':canonical},'author':{'@type':'Person','name':story.author||'Bangla Choti Kahinii'},'publisher':{'@type':'Organization','name':'Bangla Choti Kahinii','url':'https://banglachoti.pages.dev/','logo':{'@type':'ImageObject','url':'https://banglachoti.pages.dev/og-image.jpg'}},'breadcrumb':{'@type':'BreadcrumbList','itemListElement':[{'@type':'ListItem','position':1,'name':'হোম','item':'https://banglachoti.pages.dev/'},{'@type':'ListItem','position':2,'name':title,'item':canonical}]}},{'@type':'WebPage','@id':canonical,'url':canonical,'name':title+' | Bangla Choti Kahinii','isPartOf':{'@id':'https://banglachoti.pages.dev/#website'},'inLanguage':'bn-BD'}]};
  if(story.createdAt){schema['@graph'][0].datePublished=new Date(story.createdAt).toISOString();}
  if(story.updatedAt)schema['@graph'][0].dateModified=new Date(story.updatedAt).toISOString(); else if(story.createdAt)schema['@graph'][0].dateModified=new Date(story.createdAt).toISOString();
  if(story.image){schema['@graph'][0].image=[absUrl(story.image)];}
  const sc=document.createElement('script');sc.type='application/ld+json';sc.setAttribute('data-story-schema','true');sc.textContent=JSON.stringify(schema);document.head.appendChild(sc);
}
async function getCategories(){try{const s=await db.ref('categories').once('value');return Object.entries(s.val()||{}).map(([id,c])=>({...c,_id:c._id||id}));}catch(e){return[];}}

/* ── Find prev/next part for current story ─────────────────────────── */
/* Logic: slug format is "story-name-1", "story-name-2" etc.
   We extract the numeric suffix, then look for slug with (N-1) and (N+1).
   If suffix is 1 → no prev. If no story found with N+1 → no next.        */
async function findPrevNext(currentStory){
  try{
    const myRaw=String(currentStory.postLink||currentStory.customLink||currentStory.manualLink||'').trim();
    let mySlug=myRaw.replace(/^https?:\/\//i,'').replace(/^\/+|\/+$/g,'').split('/').pop();
    try{mySlug=decodeURIComponent(mySlug);}catch(e){}
    if(!mySlug)return {prev:null,next:null};

    /* Extract numeric suffix: "bidhoba-vabir-golpo-3" → base="bidhoba-vabir-golpo", num=3 */
    const m=mySlug.match(/^(.*)-(\d+)$/);
    if(!m)return {prev:null,next:null}; // no numeric suffix → single-part story, no nav

    const base=m[1];
    const num=parseInt(m[2],10);
    if(num<1)return {prev:null,next:null};

    /* Helper: find story by slug suffix from Firebase */
    async function findBySlug(slug){
      // 1. exact orderByChild query
      const q1=await db.ref('stories').orderByChild('postLink').equalTo(slug).once('value');
      if(q1.exists()){const e=Object.entries(q1.val());if(e.length){const[id,it]=e[0];return{...it,_id:it._id||id};}}
      // 2. with leading slash
      const q2=await db.ref('stories').orderByChild('postLink').equalTo('/'+slug).once('value');
      if(q2.exists()){const e=Object.entries(q2.val());if(e.length){const[id,it]=e[0];return{...it,_id:it._id||id};}}
      // 3. full scan – postLink / customLink / manualLink
      const snap=await db.ref('stories').once('value');
      const all=snap.val()||{};
      for(const [id,it] of Object.entries(all)){
        const links=[it.postLink,it.customLink,it.manualLink].map(v=>{
          if(!v)return '';
          let s=String(v).trim().replace(/^https?:\/\//i,'').replace(/^\/+|\/+$/g,'');
          try{s=decodeURIComponent(s);}catch(e){}
          return s.split('/').pop()||'';
        }).filter(Boolean);
        if(links.includes(slug))return{...it,_id:it._id||id};
      }
      return null;
    }

    /* Check prev (num-1): hide if num===1 (already first part) */
    const prevStory = num>1 ? await findBySlug(`${base}-${num-1}`) : null;
    /* Check next (num+1): hide if not found in DB */
    const nextStory = await findBySlug(`${base}-${num+1}`);

    return {prev:prevStory, next:nextStory};
  }catch(e){console.error('findPrevNext error',e);}
  return {prev:null,next:null};
}

/* ── Process inline story links: [[story-slug|Story Title]] ──────── */
function processInlineLinks(html){
  return html.replace(/\[\[([^\]|]+)\|([^\]]+)\]\]/g,(match,slug,title)=>{
    const cleanSlug=slug.trim();
    const cleanTitle=title.trim();
    const href='/'+encodeURIComponent(cleanSlug);
    return `<a class="inline-story-link" href="${href}">📖 ${escapeHTML(cleanTitle)}</a>`;
  });
}
async function getStoryLinks(id){try{const s=await db.ref(`stories/${id}/links`).once('value');const v=s.val()||{};return {series:v.series||{parts:[]},related:v.related||[]};}catch(e){return{series:{parts:[]},related:[]};}}
function categoryMap(list){const m={};(list||[]).forEach(c=>m[c.slug]=c);return m;}
function openCategory(slug){if(!slug)return;window.location.href=`/?category=${encodeURIComponent(slug)}`;}
function romanizeBanglaSlug(value){const map={'অ':'o','আ':'a','ই':'i','ঈ':'i','উ':'u','ঊ':'u','ঋ':'ri','এ':'e','ঐ':'oi','ও':'o','ঔ':'ou','া':'a','ি':'i','ী':'i','ু':'u','ূ':'u','ৃ':'ri','ে':'e','ৈ':'oi','ো':'o','ৌ':'ou','ং':'ng','ঃ':'h','ঁ':'n','ক':'k','খ':'kh','গ':'g','ঘ':'gh','ঙ':'ng','চ':'ch','ছ':'chh','জ':'j','ঝ':'jh','ঞ':'n','ট':'t','ঠ':'th','ড':'d','ঢ':'dh','ণ':'n','ত':'t','থ':'th','দ':'d','ধ':'dh','ন':'n','প':'p','ফ':'ph','ব':'b','ভ':'bh','ম':'m','য':'j','য়':'y','র':'r','ল':'l','শ':'sh','ষ':'sh','স':'s','হ':'h','ড়':'r','ঢ়':'rh','ৎ':'t','্':'','়':'','ৱ':'w'};return String(value||'').toLowerCase().normalize('NFKD').split('').map(ch=>map[ch]??ch).join('').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').replace(/-+/g,'-')||'story';}
function cleanPostSlug(value){let v=String(value||'').trim();if(/^https?:\/\//i.test(v)){try{v=new URL(v).pathname;}catch(e){}}v=v.split('/').filter(Boolean).pop()||'';try{v=decodeURIComponent(v);}catch(e){}return v.replace(/^\/+|\/+$/g,'');}
function storyLink(item){
  let lnk=String(item.postLink||item.customLink||item.manualLink||'').trim();
  if(!lnk)return '#';
  if(/^https?:\/\//i.test(lnk)){try{lnk=new URL(lnk).pathname;}catch(e){}}
  try{lnk=decodeURIComponent(lnk);}catch(e){}
  lnk=lnk.replace(/^\/+|\/+$/g,'');
  if(!lnk)return '#';
  return '/'+lnk.split('/').map(encodeURIComponent).join('/');
}
function showError(){const app=document.getElementById('app');app.className='error';app.innerHTML='<div class="error-icon">⚠️</div><div class="error-text">গল্পটি পাওয়া যায়নি।</div><a class="home" href="/">← হোমে ফিরে যান</a>';}
async function loadStory(){
  const app=document.getElementById('app');
  const params=new URLSearchParams(window.location.search);
  /* slug comes from server-side rewrite via ?slug= — browser URL is already clean */
  const slugFromParam=params.get('slug')||'';
  const oldId=params.get('id')||'';
  /* Also check pathname directly for direct visits */
  const pathParts=window.location.pathname.split('/').filter(Boolean);
  const slugFromPath=pathParts.length?decodeURIComponent(pathParts[pathParts.length-1]):'';
  const reservedPaths=['story','story.html','index.html','admin',''];
  const rawSlug=slugFromParam||(reservedPaths.includes(slugFromPath)?'':slugFromPath);

  /* cleanLink: strip domain/slashes from a postLink value */
  const cleanLink=v=>{
    let s=String(v||'').trim();
    if(!s)return '';
    if(/^https?:\/\//i.test(s)){try{s=new URL(s).pathname;}catch(e){}}
    try{s=decodeURIComponent(s);}catch(e){}
    s=s.replace(/^\/+|\/+$/g,'');
    if(!s||reservedPaths.includes(s))return '';
    return s;
  };

  /* Clean the browser URL — remove ?slug= so user sees /postLink */
  if(slugFromParam&&window.history&&window.history.replaceState){
    const cleanUrl='/'+slugFromParam.split('/').map(encodeURIComponent).join('/');
    window.history.replaceState(null,'',cleanUrl);
  }

  try{
    let story = window.__SERVER_STORY__ || null;
    if(!story){
      if(!rawSlug&&!oldId){throw new Error('No slug');}
      if(oldId){
        const snap=await db.ref(`stories/${oldId}`).once('value');
        if(snap.exists())story={...snap.val(),_id:oldId};
      } else {
        const wanted=cleanLink(rawSlug);
        if(!wanted){throw new Error('No slug');}
        /* 1️⃣ Firebase index query — exact match on postLink */
        const q1=await db.ref('stories').orderByChild('postLink').equalTo(wanted).once('value');
        if(q1.exists()){const e=Object.entries(q1.val());if(e.length){const[id,item]=e[0];story={...item,_id:item._id||id};}}
        /* 2️⃣ With leading slash */
        if(!story){
          const q2=await db.ref('stories').orderByChild('postLink').equalTo('/'+wanted).once('value');
          if(q2.exists()){const e=Object.entries(q2.val());if(e.length){const[id,item]=e[0];story={...item,_id:item._id||id};}}
        }
        /* 3️⃣ Full scan — check postLink, customLink, manualLink */
        if(!story){
          const snap=await db.ref('stories').once('value');
          const all=snap.val()||{};
          for(const [id,item] of Object.entries(all)){
            const links=[item.postLink,item.customLink,item.manualLink].map(cleanLink).filter(Boolean);
            if(links.includes(wanted)||links.includes(rawSlug)){
              story={...item,_id:item._id||id};break;
            }
          }
        }
      }
      if(!story||story.status==='draft')throw new Error('Story not found');
    }
    setSEO(story);
    const date=story.createdAt?new Date(story.createdAt).toLocaleDateString('bn-BD'):'';
    const cats=await getCategories();
    const cmap=categoryMap(cats);
    const catHtml=(story.categories||[]).map(slug=>{
      const c=cmap[slug]||{name:slug};
      const safeSlug=String(slug).replace(/'/g,"\\'");
      return `<button class="cat" onclick="openCategory('${safeSlug}')">${escapeHTML(c.name||slug)}</button>`;
    }).join('');

    const links=await getStoryLinks(story._id);
    const partsList=(links.series&&Array.isArray(links.series.parts))?links.series.parts:[];

    /* ── Smart "আরও পড়ুন" section ──────────────────────────────────────
       Rule 1: পর্ব আছে → সব পর্ব serially দেখাও (৫টার বেশি হলেও)
       Rule 2: পর্ব < ৫ → বাকি slot (৫ - পর্বের সংখ্যা) same category গল্প দিয়ে fill
       Rule 3: পর্ব নেই → category থেকে ৫টা দেখাও
       Category posts: current story বাদ দিয়ে, latest first
    ────────────────────────────────────────────────────────────────── */
    const TARGET = 5;
    const hasParts = partsList.length > 0;
    let catFillPosts = [];

    if(!hasParts || partsList.length < TARGET){
      // Need category posts to fill remaining slots
      const slotsNeeded = hasParts ? (TARGET - partsList.length) : TARGET;
      const storyCats = story.categories || [];
      if(storyCats.length > 0){
        try{
          // Fetch all stories, filter by same category, exclude current
          const allSnap = await db.ref('stories').once('value');
          const allStories = allSnap.val() || {};
          catFillPosts = Object.entries(allStories)
            .map(([id,s])=>({...s,_id:s._id||id}))
            .filter(s=>{
              if(s._id===story._id)return false; // skip current
              if(!s.postLink&&!s.customLink&&!s.manualLink)return false; // skip if no link
              if(s.status==='draft')return false;
              // Must share at least one category
              const sCats=s.categories||[];
              return storyCats.some(c=>sCats.includes(c));
            })
            .sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)) // newest first
            .slice(0, slotsNeeded);
        }catch(e){ catFillPosts=[]; }
      }
    }

    /* Build HTML */
    let linksHtml = '';

    if(hasParts){
      // Show ALL parts serially
      const partsItems = partsList.map((item,i)=>
        `<li><a href="${storyLink(item)}">${escapeHTML(item.title||`পর্ব ${item.part||i+1}`)}</a></li>`
      ).join('');
      linksHtml += `<section class="series-box"><div class="series-title">📚 এই গল্পের সকল পর্ব</div><ol class="series-list">${partsItems}</ol></section>`;
    }

    if(catFillPosts.length > 0){
      const fillItems = catFillPosts.map(item=>
        `<li><a href="${storyLink(item)}">${escapeHTML(item.title||'গল্প')}</a></li>`
      ).join('');
      const fillTitle = hasParts ? '📖 আরও গল্প পড়ুন' : '📖 একই বিভাগের আরও গল্প';
      linksHtml += `<section class="series-box"><div class="series-title related-title">${fillTitle}</div><ol class="series-list">${fillItems}</ol></section>`;
    }

    const categoryHtml = catHtml
      ? `<section class="category-end"><div class="category-title">ক্যাটাগরি</div><div class="category-list">${catHtml}</div></section>`
      : '';

    app.className='article';

    // ── View count increment ──────────────────────────────────────────
    // Admin থেকে যে value set করা আছে সেটা base ধরে, তারপর থেকে
    // প্রতিটা visit-এ +1 করে যাবে। Transaction use করা হয়েছে যাতে
    // একাধিক user একসাথে visit করলেও count ঠিকমতো বাড়ে।
    try {
      await db.ref(`stories/${story._id}/views`).transaction(current => {
        return (current || 0) + 1;
      });
      // Local copy-তেও update করি যাতে page-এ সাথে সাথে নতুন count দেখা যায়
      story.views = (Number(story.views) || 0) + 1;
    } catch(e) {
      console.warn('View count update failed:', e);
    }
    // ─────────────────────────────────────────────────────────────────

    // Find prev/next part navigation
    const {prev:prevPart, next:nextPart} = await findPrevNext(story);
    const prevHtml = prevPart
      ? `<a href="${storyLink(prevPart)}">← আগের পর্ব</a>`
      : '';
    const nextHtml = nextPart
      ? `<a href="${storyLink(nextPart)}">পরের পর্ব →</a>`
      : '';
    const hasPorboNav = prevPart || nextPart;
    const porboNavHtml = hasPorboNav
      ? `<div class="porbo-nav">${prevHtml}<div class="spacer"></div>${nextHtml}</div>`
      : '';

    // Process inline story links in content [[slug|Title]]
    const processedContent = processInlineLinks(story.content||'');

    app.innerHTML=`<div class="head"><h1 class="title">${escapeHTML(story.title||'গল্প')}</h1><div class="meta"><span>👤 ${escapeHTML(story.author||'অজ্ঞাত')}</span>${date?`<span>📅 ${date}</span>`:''}<span>👁 ${(Number(story.views)||0).toLocaleString('bn-BD')}</span></div></div>${porboNavHtml}<article class="content">${processedContent}</article>${porboNavHtml}${linksHtml}${categoryHtml}`;
    // Exact heading labels requested by the site owner.
    app.querySelectorAll('*').forEach(el=>{ if(el.children.length===0){ if(el.textContent.trim()==='এই গল্পের বিভাগ') el.textContent='ক্যাটাগরি'; if(el.textContent.trim()==='এই বিভাগের আরও গল্প') el.textContent='আরও অন্যান্য গল্প'; }});
  }catch(e){console.error(e);showError();}
}
document.getElementById('darkToggle').addEventListener('click',()=>{document.body.classList.toggle('dark');const d=document.body.classList.contains('dark');document.getElementById('darkToggle').textContent=d?'☀️':'🌙';localStorage.setItem('darkMode',d);});if(localStorage.getItem('darkMode')==='true'){document.body.classList.add('dark');document.getElementById('darkToggle').textContent='☀️';}
loadHeaderCategories();
loadStory();
