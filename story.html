<style>
*{box-sizing:border-box;margin:0;padding:0}:root{--green-dark:#1a5c38;--green-main:#217a47;--green-light:#2ea05c;--border:#d4e8dc;--text-dark:#1a1a2e;--text-gray:#555;--bg-body:#f5faf7}body{font-family:'Hind Siliguri',sans-serif;background:var(--bg-body);color:var(--text-dark);min-height:100vh}.site-topbar{position:sticky;top:0;z-index:1500;box-shadow:0 2px 8px rgba(0,0,0,.07)}.header{background:#fff;border-bottom:2px solid var(--border)}.header-top{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;max-width:1200px;margin:0 auto}.hamburger{background:none;border:none;cursor:pointer;display:flex;flex-direction:column;gap:5px;padding:4px}.hamburger span{display:block;width:22px;height:2.5px;background:var(--text-dark);border-radius:2px}.logo-wrap{text-align:center;flex:1}.logo-wrap .logo-text{font-size:24px;font-weight:700;color:var(--green-dark);font-family:Georgia,serif}.logo-wrap .logo-text span{color:var(--green-light)}.logo-wrap .tagline{font-size:11px;color:var(--text-gray);margin-top:1px}.logo-home-link{text-decoration:none;color:inherit;display:flex;align-items:center;justify-content:center;flex:1}.logo-home-link:visited,.logo-home-link:hover,.logo-home-link:active{color:inherit;text-decoration:none}.header-icons{display:flex;gap:14px;align-items:center}.header-icons button{background:none;border:none;cursor:pointer;font-size:20px;color:var(--text-dark);padding:4px}.nav{background:var(--green-dark);padding:0}.nav-inner{display:flex;align-items:center;max-width:1200px;margin:0 auto;overflow-x:auto;scrollbar-width:none}.nav-inner::-webkit-scrollbar{display:none}.nav-link{display:flex;align-items:center;gap:6px;padding:12px 18px;color:#fff;text-decoration:none;font-size:14px;font-weight:500;white-space:nowrap;transition:background .2s}.nav-link:hover,.nav-link.active{background:var(--green-light)}.nav-link.active{background:var(--green-main);border-radius:6px 6px 0 0}.nav-live{margin-left:auto;background:#e63946;color:#fff;border:none;padding:9px 18px;border-radius:22px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;margin-right:12px;margin-top:5px;margin-bottom:5px}.category-overlay{display:none;position:fixed;inset:0;z-index:1800;background:transparent}.category-overlay.open{display:block}.category-panel{position:fixed;top:0;left:0;width:180px;max-width:calc(100vw - 10px);max-height:min(68vh,560px);overflow-y:auto;background:#303030;box-shadow:0 10px 28px rgba(0,0,0,.32);border-radius:0 0 4px 4px;padding:0 0 5px}.category-panel-title{color:#fff;font-size:16px;font-weight:600;padding:10px 14px;border-bottom:1px solid rgba(255,255,255,.10);display:flex;align-items:center;justify-content:space-between;gap:8px;position:sticky;top:0;background:#303030;z-index:2}.category-panel-close{border:0;background:transparent;color:#fff;width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:17px;line-height:28px}.category-overlay-list{display:flex;flex-direction:column}.category-overlay-item{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;color:#fff;text-align:left;padding:9px 12px;font-family:'Hind Siliguri',sans-serif;font-size:14px;line-height:1.3;cursor:pointer}.category-overlay-item:hover,.category-overlay-item:active{background:rgba(255,255,255,.09)}.category-overlay-item.active{background:rgba(46,160,92,.28);color:#8cffb5}.category-overlay-empty{color:#bbb;padding:18px 14px;text-align:center;font-size:14px}body.category-menu-open{overflow:hidden}.wrap{max-width:800px;margin:0 auto;padding:18px 14px 40px}.article{background:#fff;border:1px solid #d4e8dc;border-radius:16px;overflow:hidden;box-shadow:0 2px 12px rgba(33,122,71,.10)}.head{padding:22px 20px 12px}.title{font-size:28px;line-height:1.35;color:#1a5c38;font-weight:700}.meta{display:flex;gap:12px;flex-wrap:wrap;color:#888;font-size:13px;margin-top:10px}.cats{display:block;margin-top:12px;font-size:15px;line-height:1.9;color:#217a47}.cat{border:0;background:transparent;color:#217a47;padding:0;margin:0;font-family:inherit;font-size:15px;font-weight:500;cursor:pointer}.cat:hover{text-decoration:underline}.cat+.cat::before{content:', ';color:#888}.category-end{margin:0 20px 22px;padding-top:16px;border-top:1px solid #d4e8dc}.category-title{font-size:18px;color:#1a5c38;font-weight:700;margin-bottom:7px}.category-list{font-size:15px;line-height:1.9;color:#217a47}.series-box{margin:4px 20px 24px;padding:18px 0 0;border-top:1px solid #d4e8dc}.series-title{font-size:18px;color:#1a5c38;font-weight:700;margin-bottom:10px}.series-list{margin:0;padding-left:28px}.related-title{margin-top:18px}.series-list li{padding:5px 0;color:#444;font-size:16px;line-height:1.55}.series-list a{color:#217a47;text-decoration:none;font-weight:600}.series-list a:hover{text-decoration:underline}.cover{width:100%;max-height:420px;object-fit:cover;display:block}.content{padding:22px 20px;font-size:17px;line-height:2;color:#222;overflow-wrap:anywhere;white-space:pre-wrap}.content p{margin-bottom:14px}.content img{max-width:100%;height:auto;border-radius:10px;display:block;margin:12px auto}.loading{background:#fff;border:1px solid #d4e8dc;border-radius:16px;text-align:center;padding:60px 20px;color:#777}.error{background:#fff;border:1px solid #ead1d1;border-radius:16px;text-align:center;padding:60px 20px;color:#c62828;box-shadow:0 2px 12px rgba(0,0,0,.05)}.error-icon{font-size:42px;margin-bottom:10px}.error-text{font-size:17px;font-weight:600}.home{display:inline-block;margin-top:18px;background:#217a47;color:#fff;text-decoration:none;padding:10px 18px;border-radius:24px;font-weight:600}.foot{text-align:center;color:#777;padding:20px;font-size:13px}@media(max-width:600px){.header-top{padding:10px 12px}.logo-wrap .logo-text{font-size:20px}.nav-link{padding:10px 12px;font-size:13px}.nav-live{padding:8px 14px;font-size:12px}.wrap{padding:12px 10px 30px}.article{border-radius:13px}.title{font-size:22px}.head{padding:18px 15px 12px}.content{font-size:16px;line-height:1.95;padding:18px 15px}.meta{font-size:12px;gap:8px}.cover{max-height:300px}}
body.dark{--bg-body:#0d1f14;--text-dark:#e8f5ee;--text-gray:#9dbdaa;--border:#1e3d2a;background:#0d1f14}body.dark .header{background:#0d2018;border-color:#1e3d2a}body.dark .article{background:#0d2018;border-color:#1e3d2a}body.dark .head,body.dark .content{color:#e8f5ee}body.dark .title{color:#7cffab}body.dark .meta{color:#9dbdaa}body.dark .category-end,body.dark .series-box{border-color:#1e3d2a}body.dark .category-title,body.dark .series-title{color:#7cffab}body.dark .category-list,body.dark .series-list a{color:#7cffab}body.dark .series-list li{color:#d4e8dc}body.dark .foot{color:#7f9c89}body.dark .loading{background:#0d2018;border-color:#1e3d2a;color:#9dbdaa}body.dark .error{background:#0d2018;border-color:#4b2b2b}@media(max-width:600px){.category-panel{width:180px;max-width:calc(100vw - 10px);max-height:68vh}}
</style>
</head>
<body>
<div class="site-topbar">
<header class="header">
  <div class="header-top">
    <button class="hamburger" id="hamburgerBtn" aria-label="Menu" onclick="toggleCategoryOverlay(); return false;"><span></span><span></span><span></span></button>
    <a href="https://banglachoti.pages.dev" class="logo-home-link" aria-label="Bangla Choti Kahinii Home"><div class="logo-wrap"><div class="logo-text">Bangla Choti Kahinii<span>🌿</span></div><div class="tagline">বাংলা গল্পের সবচেয়ে বড় ঠিকানা</div></div></a>
    <div class="header-icons"><button id="darkToggle" title="Dark Mode">🌙</button><button id="searchToggle" title="Search" onclick="goHomeSearch()">🔍</button></div>
  </div>
</header>
<nav class="nav"><div class="nav-inner">
  <a href="/" class="nav-link active">🏠 হোম</a>
  <a href="#" id="categoryNavBtn" class="nav-link" onclick="toggleCategoryOverlay(); return false;">বিভাগ <span id="categoryChevron">⌄</span></a>
  <a href="/" class="nav-link">গল্প লিখে পাঠান</a>
  <a href="/?category=serabanglachoti" class="nav-link">সেরা গল্প</a>
  <a href="/" class="nav-link">যোগাযোগ</a>
  <button class="nav-live">🔥 LIVE CAMS</button>
</div></nav>
</div>
<div class="category-overlay" id="categoryOverlay" onclick="closeCategoryOverlay(event)"><div class="category-panel" onclick="event.stopPropagation()"><div class="category-panel-title"><span>📚 বিভাগ</span><button class="category-panel-close" onclick="toggleCategoryOverlay(false)" aria-label="Close">✕</button></div><div class="category-overlay-list" id="categoryOverlayList"><div class="category-overlay-empty">বিভাগ লোড হচ্ছে...</div></div></div></div>
<main class="wrap"><div id="app" class="loading">গল্প লোড হচ্ছে...</div></main>
<footer class="foot">🌿 গল্প পড়ুন, কল্পনার জগতে হারিয়ে যান...</footer>
<script>
const API='https://choti.onrender.com';
function goHomeSearch(){window.location.href='/?search=';}
let categoryList=[];
async function loadHeaderCategories(){try{const r=await fetch(`${API}/api/categories?ts=${Date.now()}`,{cache:'no-store'});categoryList=r.ok?await r.json():[];}catch(e){categoryList=[];}renderHeaderCategories();}
function renderHeaderCategories(){
  const list=document.getElementById('categoryOverlayList');
  if(!list)return;
  const items=[`<button type="button" class="category-overlay-item active" onclick="selectHeaderCategory('')">📚 <span>সব গল্প</span></button>`];
  categoryList.forEach(c=>{
    if(!c||!c.slug)return;
    const slug=String(c.slug).replace(/'/g, "\\'");
    items.push(`<button type="button" class="category-overlay-item" onclick="selectHeaderCategory('${slug}')">${escapeHTML(c.icon||'📖')} <span>${escapeHTML(c.name||c.slug)}</span></button>`);
  });
  list.innerHTML=items.length?items.join(''):`<div class="category-overlay-empty">কোনো বিভাগ পাওয়া যায়নি।</div>`;
}

function toggleCategoryOverlay(force){const overlay=document.getElementById('categoryOverlay');const panel=document.querySelector('#categoryOverlay .category-panel');const navBtn=document.getElementById('categoryNavBtn');if(!overlay||!panel)return;const open=typeof force==='boolean'?force:!overlay.classList.contains('open');if(open){renderHeaderCategories();overlay.classList.add('open');document.body.classList.add('category-menu-open');const nav=document.querySelector('.nav');const target=navBtn||nav;if(target){const rect=target.getBoundingClientRect();const navRect=nav?nav.getBoundingClientRect():rect;panel.style.top=`${Math.round(navRect.bottom)}px`;let left=Math.round(rect.left);const maxLeft=window.innerWidth-panel.getBoundingClientRect().width-6;panel.style.left=`${Math.max(0,Math.min(left,maxLeft))}px`;}}else{overlay.classList.remove('open');document.body.classList.remove('category-menu-open');panel.style.top='';panel.style.left='';if(navBtn)navBtn.classList.remove('active');const hb=document.getElementById('hamburgerBtn');if(hb)hb.classList.remove('active');}}
function closeCategoryOverlay(e){if(e&&e.target!==e.currentTarget)return;toggleCategoryOverlay(false);}
function selectHeaderCategory(slug){toggleCategoryOverlay(false);window.location.href=slug?`/?category=${encodeURIComponent(slug)}`:'/';}
function escapeHTML(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
function stripHTML(v){const d=document.createElement('div');d.innerHTML=String(v||'');return (d.textContent||d.innerText||'').replace(/\s+/g,' ').trim();}
function absUrl(v){try{return new URL(v,window.location.origin).href;}catch(e){return String(v||'');}}
function setSEO(story){
  const title=String(story.title||'বাংলা গল্প').trim();
  const desc=String(story.excerpt||stripHTML(story.content).slice(0,160)||`${title} গল্পটি Bangla Choti Kahinii-তে পড়ুন।`).trim();
  const canonical=story.slug?`https://banglachoti.pages.dev/${encodeURIComponent(story.slug)}/`:window.location.href.split('?')[0];
  document.title=`${title} | Bangla Choti Kahinii`;
  const md=document.querySelector('meta[name="description"]'); if(md) md.content=desc;
  const c=document.getElementById('canonicalLink'); if(c)c.href=canonical;
  const props={ogTitle:title,ogDescription:desc,ogUrl:canonical,twitterTitle:title,twitterDescription:desc};
  if(story.image){props.ogImage=absUrl(story.image);props.twitterImage=absUrl(story.image);}
  Object.entries(props).forEach(([id,v])=>{const e=document.getElementById(id);if(e)e.setAttribute('content',v);});
  document.querySelectorAll('script[data-story-schema]').forEach(e=>e.remove());
  const schema={'@context':'https://schema.org','@type':'Article','headline':title,'description':desc,'url':canonical,'inLanguage':'bn-BD','isAccessibleForFree':true,'mainEntityOfPage':{'@type':'WebPage','@id':canonical},'author':{'@type':'Person','name':story.author||'Bangla Choti Kahinii'},'publisher':{'@type':'Organization','name':'Bangla Choti Kahinii','url':'https://banglachoti.pages.dev/'}};
  if(story.createdAt)schema.datePublished=new Date(story.createdAt).toISOString();
  if(story.updatedAt)schema.dateModified=new Date(story.updatedAt).toISOString(); else if(story.createdAt)schema.dateModified=new Date(story.createdAt).toISOString();
  if(story.image)schema.image=[absUrl(story.image)];
  const sc=document.createElement('script');sc.type='application/ld+json';sc.setAttribute('data-story-schema','true');sc.textContent=JSON.stringify(schema);document.head.appendChild(sc);
}
async function getCategories(){try{const r=await fetch(`${API}/api/categories`);return r.ok?await r.json():[]}catch(e){return[];}}
async function getStoryLinks(id){try{const r=await fetch(`${API}/api/stories/related/${encodeURIComponent(id)}`);return r.ok?await r.json():{series:{parts:[]},related:[]};}catch(e){return{series:{parts:[]},related:[]};}}
function categoryMap(list){const m={};(list||[]).forEach(c=>m[c.slug]=c);return m;}
function openCategory(slug){if(!slug)return;window.location.href=`/?category=${encodeURIComponent(slug)}`;}
function storyLink(item){if(item.slug)return `/${encodeURIComponent(item.slug)}/`;return `/story.html?id=${encodeURIComponent(item._id)}`;}
function showError(){const app=document.getElementById('app');app.className='error';app.innerHTML='<div class="error-icon">⚠️</div><div class="error-text">গল্পটি পাওয়া যায়নি।</div><a class="home" href="/">← হোমে ফিরে যান</a>';}
async function loadStory(){
  const app=document.getElementById('app');
  const parts=window.location.pathname.split('/').filter(Boolean);
  const pathPart=parts.length?decodeURIComponent(parts[parts.length-1]):'';
  const params=new URLSearchParams(window.location.search);
  const querySlug=params.get('slug');
  const oldId=params.get('id');
  const isPlaceholder=!pathPart||pathPart==='story'||pathPart==='story.html'||pathPart==='index.html';
  try{
    let story = window.__SERVER_STORY__ || null;
    if(!story){
      let url;
      if(querySlug){url=`${API}/api/stories/slug/${encodeURIComponent(querySlug)}`;}
      else if(!isPlaceholder){url=`${API}/api/stories/slug/${encodeURIComponent(pathPart)}`;}
      else if(oldId){url=`${API}/api/stories/${encodeURIComponent(oldId)}`;}
      else{throw new Error('Missing story identifier');}
      const res=await fetch(url,{headers:{'Accept':'application/json'},cache:'no-store'});
      if(!res.ok)throw new Error('Story not found');
      story=await res.json();
    }
    setSEO(story);
    const date=story.createdAt?new Date(story.createdAt).toLocaleDateString('bn-BD'):'';
    const cats=await getCategories();
    const cmap=categoryMap(cats);
    const catHtml=(story.categories||[]).map(slug=>{
      const c=cmap[slug]||{name:slug};
      const safeSlug=String(slug).replace(/'/g,"\\'");
      return `<button class="cat" onclick="openCategory('${safeSlug}')">${escapeHTML(c.name||slug)}</button>`;
    }).join('');

    const links=await getStoryLinks(story._id);
    const partsList=(links.series&&Array.isArray(links.series.parts))?links.series.parts:[];
    const relatedList=Array.isArray(links.related)?links.related:[];
    const optionItems=partsList.map((item,i)=>
      `<li><a href="${storyLink(item)}">${escapeHTML(item.title||`পর্ব ${item.part||i+1}`)}</a></li>`
    ).join('');
    const relatedItems=relatedList.map(item=>
      `<li><a href="${storyLink(item)}">${escapeHTML(item.title||'গল্প')}</a></li>`
    ).join('');
    let linksHtml = '';
    if (partsList.length) {
      linksHtml += `<section class="series-box"><div class="series-title">এই গল্পের অন্যান্য পর্ব</div><ol class="series-list">${optionItems}</ol></section>`;
    }
    if (relatedList.length && partsList.length < 4) {
      linksHtml += `<section class="series-box"><div class="series-title related-title">আরও অন্যান্য গল্প</div><ol class="series-list">${relatedItems}</ol></section>`;
    }
    if (!partsList.length && relatedList.length) {
      linksHtml = `<section class="series-box"><div class="series-title">আরও অন্যান্য গল্প</div><ol class="series-list">${relatedItems}</ol></section>`;
    }

    const categoryHtml = catHtml
      ? `<section class="category-end"><div class="category-title">ক্যাটাগরি</div><div class="category-list">${catHtml}</div></section>`
      : '';

    app.className='article';
    app.innerHTML=`<div class="head"><h1 class="title">${escapeHTML(story.title||'গল্প')}</h1><div class="meta"><span>👤 ${escapeHTML(story.author||'অজ্ঞাত')}</span>${date?`<span>📅 ${date}</span>`:''}<span>👁 ${(Number(story.views)||0).toLocaleString('bn-BD')}</span></div></div>${story.image?`<img class="cover" src="${escapeHTML(story.image)}" alt="${escapeHTML(story.title||'গল্প')}" loading="lazy">`:''}<article class="content">${story.content||''}</article>${categoryHtml}${linksHtml}`;
    // Exact heading labels requested by the site owner.
    app.querySelectorAll('*').forEach(el=>{ if(el.children.length===0){ if(el.textContent.trim()==='এই গল্পের বিভাগ') el.textContent='ক্যাটাগরি'; if(el.textContent.trim()==='এই বিভাগের আরও গল্প') el.textContent='আরও অন্যান্য গল্প'; }});
  }catch(e){console.error(e);showError();}
}
document.getElementById('darkToggle').addEventListener('click',()=>{document.body.classList.toggle('dark');const d=document.body.classList.contains('dark');document.getElementById('darkToggle').textContent=d?'☀️':'🌙';localStorage.setItem('darkMode',d);});if(localStorage.getItem('darkMode')==='true'){document.body.classList.add('dark');document.getElementById('darkToggle').textContent='☀️';}
loadHeaderCategories();
loadStory();
</script>
</body>
</html>
