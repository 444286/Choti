<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>গল্প | Bangla Choti Kahinii</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:'Hind Siliguri',sans-serif;
  background:#f5faf7;
  color:#1a1a2e;
  min-height:100vh;
}

/* TOP BAR */
.top{
  position:sticky;
  top:0;
  z-index:10;
  background:#fff;
  border-bottom:2px solid #d4e8dc;
  padding:12px 16px;
  display:flex;
  align-items:center;
  gap:12px;
}

.back{
  border:0;
  background:#e8f5ee;
  color:#1a5c38;
  border-radius:22px;
  padding:8px 14px;
  font-family:inherit;
  font-weight:600;
  cursor:pointer;
  font-size:14px;
}

.back:active{
  transform:scale(.97);
}

.brand{
  font-weight:700;
  color:#1a5c38;
  font-size:18px;
}

/* MAIN */
.wrap{
  max-width:800px;
  margin:0 auto;
  padding:18px 14px 40px;
}

/* ARTICLE */
.article{
  background:#fff;
  border:1px solid #d4e8dc;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 2px 12px rgba(33,122,71,.10);
}

.head{
  padding:22px 20px 12px;
}

.title{
  font-size:28px;
  line-height:1.35;
  color:#1a5c38;
  font-weight:700;
}

.meta{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  color:#888;
  font-size:13px;
  margin-top:10px;
}

.cover{
  width:100%;
  max-height:420px;
  object-fit:cover;
  display:block;
}

/* STORY CONTENT */
.content{
  padding:22px 20px;
  font-size:17px;
  line-height:2;
  color:#222;
  overflow-wrap:anywhere;
}

.content p{
  margin-bottom:14px;
}

.content img{
  max-width:100%;
  height:auto;
  border-radius:10px;
  display:block;
  margin:12px auto;
}

.content a{
  color:#1769aa;
  word-break:break-word;
}

/* LOADING */
.loading{
  background:#fff;
  border:1px solid #d4e8dc;
  border-radius:16px;
  text-align:center;
  padding:60px 20px;
  color:#777;
}

/* ERROR */
.error{
  background:#fff;
  border:1px solid #ead1d1;
  border-radius:16px;
  text-align:center;
  padding:60px 20px;
  color:#c62828;
  box-shadow:0 2px 12px rgba(0,0,0,.05);
}

.error-icon{
  font-size:42px;
  margin-bottom:10px;
}

.error-text{
  font-size:17px;
  font-weight:600;
}

.home{
  display:inline-block;
  margin-top:18px;
  background:#217a47;
  color:#fff;
  text-decoration:none;
  padding:10px 18px;
  border-radius:24px;
  font-weight:600;
}

/* FOOTER */
.foot{
  text-align:center;
  color:#777;
  padding:20px;
  font-size:13px;
}

/* MOBILE */
@media(max-width:600px){

  .top{
    padding:10px 12px;
  }

  .brand{
    font-size:16px;
  }

  .wrap{
    padding:12px 10px 30px;
  }

  .article{
    border-radius:13px;
  }

  .title{
    font-size:22px;
  }

  .head{
    padding:18px 15px 12px;
  }

  .content{
    font-size:16px;
    line-height:1.95;
    padding:18px 15px;
  }

  .meta{
    font-size:12px;
    gap:8px;
  }

  .cover{
    max-height:300px;
  }
}
</style>
</head>

<body>

<header class="top">
  <button class="back" onclick="goHome()">← হোম</button>
  <div class="brand">Bangla Choti Kahinii 🌿</div>
</header>

<main class="wrap">

  <div id="app" class="loading">
    গল্প লোড হচ্ছে...
  </div>

</main>

<footer class="foot">
  🌿 গল্প পড়ুন, কল্পনার জগতে হারিয়ে যান...
</footer>


<script>

/* ==============================
   BACKEND API
============================== */

const API = 'https://choti.onrender.com';


/* ==============================
   HOME
============================== */

function goHome(){
  window.location.href = '/';
}


/* ==============================
   HTML ESCAPE
============================== */

function escapeHTML(value){

  return String(value ?? '').replace(
    /[&<>"']/g,
    function(match){

      return {
        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        '"':'&quot;',
        "'":'&#039;'
      }[match];

    }
  );

}


/* ==============================
   GET STORY URL
============================== */

function getStoryInfo(){

  const pathname = window.location.pathname;

  /*
    Example:

    /ma_meyer_golpo/
    ↓
    ma_meyer_golpo
  */

  const parts = pathname
    .split('/')
    .filter(Boolean);

  let slug = '';

  if(parts.length > 0){

    slug = decodeURIComponent(
      parts[parts.length - 1]
    );

  }


  /* Query parameters */

  const params = new URLSearchParams(
    window.location.search
  );

  const querySlug = params.get('slug');
  const oldId = params.get('id');


  return {
    slug: querySlug || slug,
    id: oldId
  };

}


/* ==============================
   LOAD STORY
============================== */

async function loadStory(){

  const app = document.getElementById('app');

  const info = getStoryInfo();

  let url = '';


  try{

    /*
      PRIORITY 1
      ?slug=ma_meyer_golpo
    */

    if(info.slug &&
       info.slug !== 'story' &&
       info.slug !== 'story.html' &&
       info.slug !== 'index.html'){

      url =
        API +
        '/api/stories/slug/' +
        encodeURIComponent(info.slug);

    }

    /*
      PRIORITY 2
      Old link:

      /story.html?id=MongoID
    */

    else if(info.id){

      url =
        API +
        '/api/stories/' +
        encodeURIComponent(info.id);

    }

    /*
      Invalid URL
    */

    else{

      throw new Error('Story link missing');

    }


    /* ==============================
       FETCH
    ============================== */

    const response = await fetch(url, {
      method:'GET',
      headers:{
        'Accept':'application/json'
      }
    });


    if(!response.ok){

      throw new Error(
        'Story not found: ' +
        response.status
      );

    }


    const story = await response.json();


    /* ==============================
       STORY DATA
    ============================== */

    const title =
      story.title ||
      'গল্প';


    const author =
      story.author ||
      'অজ্ঞাত';


    const views =
      Number(story.views || 0);


    let date = '';

    if(story.createdAt){

      const d = new Date(story.createdAt);

      if(!isNaN(d.getTime())){

        date =
          d.toLocaleDateString('bn-BD');

      }

    }


    /* ==============================
       PAGE TITLE
    ============================== */

    document.title =
      title +
      ' | Bangla Choti Kahinii';


    /* ==============================
       STORY IMAGE
    ============================== */

    let imageHTML = '';

    if(story.image){

      imageHTML = `
        <img
          class="cover"
          src="${escapeHTML(story.image)}"
          alt="${escapeHTML(title)}"
          loading="lazy"
        >
      `;

    }


    /* ==============================
       STORY CONTENT
    ============================== */

    const content =
      story.content || '';


    /* ==============================
       SHOW STORY
    ============================== */

    app.className = 'article';

    app.innerHTML = `

      <div class="head">

        <h1 class="title">
          ${escapeHTML(title)}
        </h1>

        <div class="meta">

          <span>
            👤 ${escapeHTML(author)}
          </span>

          ${
            date
            ? `<span>📅 ${date}</span>`
            : ''
          }

          <span>
            👁 ${views.toLocaleString('bn-BD')}
          </span>

        </div>

      </div>


      ${imageHTML}


      <article class="content">

        ${content}

      </article>

    `;


  }
  catch(error){

    console.error(
      'Story loading error:',
      error
    );


    app.className = 'error';

    app.innerHTML = `

      <div class="error-icon">
        ⚠️
      </div>

      <div class="error-text">
        গল্পটি পাওয়া যায়নি।
      </div>

      <a
        class="home"
        href="/"
      >
        ← হোমে ফিরে যান
      </a>

    `;

  }

}


/* ==============================
   START
============================== */

loadStory();

</script>

</body>
</html>
